name: Preview Create/Update

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize


# Need ID token write permission to use OIDC
permissions:
  id-token: write

env:
  PR: pr-${{ github.event.number }}
  RUN: run-${{ github.run_number }}-${{ github.run_attempt }}

jobs:

  build:
    name: Update Docs Preview

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout branch
      uses: actions/checkout@v5
      with:
        # Full history so the PR-time link check can diff against the base branch.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        cache: 'yarn'
        node-version: 22

    - name: Install dependencies
      run: yarn install

    - name: Build Website
      run: yarn antora ./antora-playbook.yml

    - name: Rename site folder to docs
      run: |
        mv ./build/site ./build/docs

    - name: Rename sitemap.xml to antora-sitemap.xml
      run: |
        mv ./build/docs/sitemap.xml ./build/docs/antora-sitemap.xml

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::327995277200:role/staging-tinymce-docs-update
        role-session-name: tinymce-docs-update
        aws-region: us-east-1

    - name: Upload website preview to S3
      run: |
        aws s3 sync ./build s3://tiny-cloud-antora-docs-preview/${PR}/${RUN}

    - name: Create redirects on S3
      uses: tinymce/tinymce-docs-generate-redirects-action@v1.0
      with:
        build: ./build/
        redirects: https://raw.githubusercontent.com/tinymce/tinymce-docs/refs/heads/main/redirects.json
        bucket: tiny-cloud-antora-docs-preview
        prefix: ${{ env.PR }}/${{ env.RUN }}
        parallel: 10

    - name: Update pointer to current run output
      run: |
        aws s3api put-object --bucket tiny-cloud-antora-docs-preview --key ${PR}/index.html --body .github/workflows/resources/empty.html --content-type text/html --metadata pointer=${RUN}

    # Link check runs last so it can never block the preview deployment.
    #
    # Links are extracted from the BUILT HTML, not from the .adoc diff. lychee's
    # HTML parser sees only real <a href> anchors, so URLs that appear inside
    # [source] code samples (container hostnames, placeholder domains, shell and
    # template literals) and Antora attributes that are substituted at build time
    # can never reach the checker. Measured over 400 commits of real history,
    # extracting from raw .adoc text produced a 16% false-failure rate, none of
    # which was genuine link rot.
    #
    # The diff is still used, but only to scope the *result* to links this PR
    # touched. Because it filters rendered anchors rather than feeding the
    # checker, an over-broad or malformed match simply fails to intersect a real
    # anchor — it cannot manufacture a failure.
    - name: Check links in the built site
      id: lychee
      uses: lycheeverse/lychee-action@v2
      with:
        args: --config .lychee.toml --no-progress --format json './build/docs/tinymce/latest/**/*.html'
        output: lychee/results.json
        token: ${{ secrets.GITHUB_TOKEN }}
        fail: false
        jobSummary: false

    - name: Report links added or changed by this PR
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
      run: |
        git fetch --no-tags --quiet origin "$BASE"

        # Candidate URLs from the diff. Permissive on purpose: this only scopes
        # the report, so a bad match is inert rather than a false failure.
        git diff "origin/${BASE}...HEAD" -- '*.adoc' \
          | grep '^+' | grep -v '^+++' \
          | grep -oE "https?://[^][<>\"^\`)+,|' ]+" \
          | sed -E 's/[.,;:]+$//' | sort -u > touched-urls.txt || true

        # Broken links found in the rendered site, as page + url + reason.
        if [ ! -f lychee/results.json ]; then
          echo "Link checker produced no report; skipping." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        jq -r '.error_map // {} | to_entries[] | .key as $page | .value[]
               | [$page, .url, (.status.text // "unknown")] | @tsv' \
          lychee/results.json > broken-all.tsv

        # Keep only the broken links this PR touched (trailing-slash tolerant).
        awk -F'\t' '
          function norm(u){ sub(/\/+$/,"",u); return u }
          NR==FNR { touched[norm($0)]=1; next }
          norm($2) in touched { print }
        ' touched-urls.txt broken-all.tsv > broken-mine.tsv

        mine=$(wc -l < broken-mine.tsv | tr -d '[:space:]')
        all=$(wc -l < broken-all.tsv | tr -d '[:space:]')

        {
          echo "## External link check"
          echo
          echo "Links changed by this pull request: $(wc -l < touched-urls.txt | tr -d '[:space:]')"
          echo
          if [ "$mine" -eq 0 ]; then
            echo "No broken links were introduced by this pull request."
          else
            echo "### Broken links introduced by this pull request"
            echo
            echo "| Page | Link | Reason |"
            echo "|------|------|--------|"
            sed -E 's#^[^\t]*/docs/tinymce/latest/##' broken-mine.tsv \
              | awk -F'\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }'
          fi
          if [ "$all" -gt "$mine" ]; then
            echo
            echo "_$((all - mine)) further broken link(s) already present elsewhere in the site; these are tracked by the weekly scheduled scan._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # Non-blocking at rollout. Change to `exit 1` to make this a merge gate
        # once the baseline recorded in the scheduled scan is clean.
        if [ "$mine" -gt 0 ]; then
          echo "::warning::${mine} broken link(s) introduced by this pull request. See the job summary."
        fi

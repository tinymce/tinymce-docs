name: Preview Create/Update

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize


# Need ID token write permission to use OIDC
permissions:
  id-token: write

env:
  PR: pr-${{ github.event.number }}
  RUN: run-${{ github.run_number }}-${{ github.run_attempt }}

jobs:

  build:
    name: Update Docs Preview

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout branch
      uses: actions/checkout@v5
      with:
        # Full history so the PR-time link check can diff against the base branch.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        cache: 'yarn'
        node-version: 22

    - name: Install dependencies
      run: yarn install

    - name: Build Website
      run: yarn antora ./antora-playbook.yml

    - name: Rename site folder to docs
      run: |
        mv ./build/site ./build/docs

    - name: Rename sitemap.xml to antora-sitemap.xml
      run: |
        mv ./build/docs/sitemap.xml ./build/docs/antora-sitemap.xml

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::327995277200:role/staging-tinymce-docs-update
        role-session-name: tinymce-docs-update
        aws-region: us-east-1

    - name: Upload website preview to S3
      run: |
        aws s3 sync ./build s3://tiny-cloud-antora-docs-preview/${PR}/${RUN}

    - name: Create redirects on S3
      uses: tinymce/tinymce-docs-generate-redirects-action@v1.0
      with:
        build: ./build/
        redirects: https://raw.githubusercontent.com/tinymce/tinymce-docs/refs/heads/main/redirects.json
        bucket: tiny-cloud-antora-docs-preview
        prefix: ${{ env.PR }}/${{ env.RUN }}
        parallel: 10

    - name: Update pointer to current run output
      run: |
        aws s3api put-object --bucket tiny-cloud-antora-docs-preview --key ${PR}/index.html --body .github/workflows/resources/empty.html --content-type text/html --metadata pointer=${RUN}

    # Link check runs last so it never blocks the preview deployment. It
    # validates only the external links this PR adds or changes in .adoc source
    # (pages or partials) — the changed link is checked once, regardless of how
    # many pages include it. Non-blocking at rollout (fail: false); flip to
    # fail: true once the baseline is clean.
    - name: Extract external links changed in this PR
      id: changed_links
      run: |
        base="origin/${{ github.event.pull_request.base.ref }}"
        git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
        git diff "$base...HEAD" -- 'modules/**/*.adoc' \
          | awk '/^\+[^+]/' \
          | grep -oE 'https?://[^][<>"^ '"'"']+' \
          | sed -E 's/[.,;:]+$//' | sort -u > changed-links.txt || true
        echo "count=$(grep -c . changed-links.txt || echo 0)" >> "$GITHUB_OUTPUT"
        echo "Changed external links to validate:"; cat changed-links.txt

    - name: Check changed links
      if: steps.changed_links.outputs.count != '0'
      uses: lycheeverse/lychee-action@v2
      with:
        args: --config .lychee.toml --no-progress changed-links.txt
        format: markdown
        output: lychee/results.md
        token: ${{ secrets.GITHUB_TOKEN }}
        fail: false
        jobSummary: true
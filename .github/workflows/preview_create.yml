name: Preview Create/Update

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize


# Need ID token write permission to use OIDC
permissions:
  id-token: write

env:
  PR: pr-${{ github.event.number }}
  RUN: run-${{ github.run_number }}-${{ github.run_attempt }}

jobs:

  build:
    name: Update Docs Preview

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout branch
      uses: actions/checkout@v5
      with:
        # Full history so the PR-time link check can diff against the base branch.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        cache: 'yarn'
        node-version: 22

    - name: Install dependencies
      run: yarn install

    - name: Build Website
      run: yarn antora ./antora-playbook.yml

    - name: Rename site folder to docs
      run: |
        mv ./build/site ./build/docs

    - name: Rename sitemap.xml to antora-sitemap.xml
      run: |
        mv ./build/docs/sitemap.xml ./build/docs/antora-sitemap.xml

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::327995277200:role/staging-tinymce-docs-update
        role-session-name: tinymce-docs-update
        aws-region: us-east-1

    - name: Upload website preview to S3
      run: |
        aws s3 sync ./build s3://tiny-cloud-antora-docs-preview/${PR}/${RUN}

    - name: Create redirects on S3
      uses: tinymce/tinymce-docs-generate-redirects-action@v1.0
      with:
        build: ./build/
        redirects: https://raw.githubusercontent.com/tinymce/tinymce-docs/refs/heads/main/redirects.json
        bucket: tiny-cloud-antora-docs-preview
        prefix: ${{ env.PR }}/${{ env.RUN }}
        parallel: 10

    - name: Update pointer to current run output
      run: |
        aws s3api put-object --bucket tiny-cloud-antora-docs-preview --key ${PR}/index.html --body .github/workflows/resources/empty.html --content-type text/html --metadata pointer=${RUN}

    # Link check runs last so it can never block the preview deployment.
    #
    # Links are checked from the BUILT HTML, not from the .adoc diff. lychee's
    # HTML parser sees only real <a href> anchors, so URLs that appear inside
    # [source] code samples (container hostnames, placeholder domains, shell and
    # template literals) and Antora attributes that are substituted at build time
    # can never reach the checker. Measured over 400 commits of real history,
    # extracting from raw .adoc text produced a 16% false-failure rate, none of
    # which was genuine link rot.
    #
    # Only the links this pull request touched are checked over the network.
    # `--dump` runs lychee's own extractor with no requests at all, which is what
    # keeps the built-HTML guarantee above while reducing a ~410-URL crawl to the
    # handful a PR actually changed. Everything else in the site is covered by the
    # weekly scheduled scan.
    - name: Collect links added or changed by this PR
      id: touched
      env:
        BASE: ${{ github.event.pull_request.base.ref }}
      run: |
        git fetch --no-tags --quiet origin "$BASE"

        # Candidate URLs from the diff. Permissive on purpose: this only narrows
        # what gets checked, and every candidate must still be confirmed as a
        # rendered anchor below, so a bad match is inert rather than a false
        # failure.
        git diff "origin/${BASE}...HEAD" -- '*.adoc' \
          | grep '^+' | grep -v '^+++' \
          | grep -oE "https?://[^][<>\"^\`)+,|' ]+" \
          | sed -E 's/[.,;:]+$//' | sed -E 's#/+$##' \
          | LC_ALL=C sort -u > touched-urls.txt || true

        count=$(wc -l < touched-urls.txt | tr -d '[:space:]')
        echo "count=${count}" >> "$GITHUB_OUTPUT"
        echo "This pull request changed ${count} candidate link(s)."

    # Restores lychee's on-disk request cache. Without this the cache settings in
    # .lychee.toml have no effect in CI, because each run starts on a clean runner.
    - name: Restore link checker cache
      if: steps.touched.outputs.count != '0'
      uses: actions/cache@v4
      with:
        path: .lycheecache
        key: lychee-${{ github.run_id }}
        restore-keys: lychee-

    # No network requests: this only lists the links lychee would check.
    # lychee-action@v2 is a floating major tag, so its default checker version can
    # move without a change here. Both steps pin the checker explicitly.
    - name: List links rendered in the built site
      if: steps.touched.outputs.count != '0'
      uses: lycheeverse/lychee-action@v2
      with:
        args: --config .lychee.toml --dump --no-progress './build/docs/tinymce/latest/**/*.html'
        lycheeVersion: v0.24.2
        output: lychee/rendered.txt
        token: ${{ secrets.GITHUB_TOKEN }}
        fail: false
        jobSummary: false

    - name: Narrow to links this PR touched
      id: narrow
      run: |
        mkdir -p lychee
        : > to-check.txt
        if [ -s lychee/rendered.txt ]; then
          # Trailing-slash tolerant on both sides so a cosmetic difference does
          # not drop a genuine match.
          sed -E 's#/+$##' lychee/rendered.txt | LC_ALL=C sort -u > rendered-normalised.txt
          LC_ALL=C sort -u touched-urls.txt > touched-normalised.txt
          LC_ALL=C comm -12 rendered-normalised.txt touched-normalised.txt > to-check.txt
        fi
        count=$(wc -l < to-check.txt | tr -d '[:space:]')
        echo "count=${count}" >> "$GITHUB_OUTPUT"
        echo "${count} of the PR's link(s) render as anchors and will be checked."

    # The only step that touches the network. Timeout and retry budget are
    # tightened here rather than in .lychee.toml, so the shared config stays
    # identical to the scheduled scan, which keeps the more patient settings.
    - name: Check links this PR touched
      id: lychee
      if: steps.narrow.outputs.count != '0'
      uses: lycheeverse/lychee-action@v2
      with:
        args: --config .lychee.toml --no-progress --timeout 15 --max-retries 1 to-check.txt
        lycheeVersion: v0.24.2
        format: json
        output: lychee/results.json
        token: ${{ secrets.GITHUB_TOKEN }}
        fail: false
        jobSummary: false

    - name: Report links added or changed by this PR
      continue-on-error: true
      env:
        TOUCHED: ${{ steps.touched.outputs.count }}
        CHECKED: ${{ steps.narrow.outputs.count }}
      run: |
        {
          echo "## External link check"
          echo
          echo "Links changed by this pull request: ${TOUCHED}"
          echo "Links checked (those that render as anchors): ${CHECKED}"
          echo
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${CHECKED}" -eq 0 ]; then
          echo "No changed links needed checking." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ ! -f lychee/results.json ]; then
          echo "Link checker produced no report; skipping." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Trim any trailing content after the JSON object: the root object is the
        # only one closing at column 0, so this is an exact cut.
        sed -n '1,/^}$/p' lychee/results.json > lychee/results.clean.json

        jq -r '.error_map // {} | to_entries[] | .value[]
               | [.url, (.status.text // "unknown")] | @tsv' \
          lychee/results.clean.json | sort -u > broken.tsv

        broken=$(wc -l < broken.tsv | tr -d '[:space:]')

        if [ "${broken}" -eq 0 ]; then
          echo "No broken links were introduced by this pull request." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        {
          echo "### Broken links introduced by this pull request"
          echo
          echo "| Link | Reason |"
          echo "|------|--------|"
          awk -F'\t' '{ printf "| %s | %s |\n", $1, $2 }' broken.tsv
        } >> "$GITHUB_STEP_SUMMARY"

        # Non-blocking at rollout. Change to `exit 1` to make this a merge gate
        # once the baseline recorded in the scheduled scan is clean.
        echo "::warning::${broken} broken link(s) introduced by this pull request. See the job summary."

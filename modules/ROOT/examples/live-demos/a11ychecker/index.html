  <h1>Port Ellery City Council: residents' update, summer 2027</h1>
  <p><img style="display: block; margin-left: auto; margin-right: auto;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/background-clouds-daylight-747964_thumb.jpg" alt="" role="presentation" width="440" height="277"></p>
  <p>Summer brings a new waste collection cycle, extended pool hours and the start of dog registration renewals. Read on for the dates that matter to your household.</p>
  <h2>Waste and recycling</h2>
  <p>From December 1, recycling and green waste move to an every-two-weeks cycle so that collection trucks can cover the new Bayview estate.</p>
  <h4>What goes in each bin</h4>
  <ul>
    <li>Yellow lid: paper, cardboard, glass bottles and clean plastic containers</li>
    <li>Green lid: grass clippings, leaves, prunings and food scraps</li>
    <li>Red lid: everything else, except batteries, paint and gas bottles</li>
  </ul>

    <colgroup><col style="width: 24.2%;"><col style="width: 28.8%;"><col style="width: 47.0%;"></colgroup>

      <tr>
        <td>Suburb</td>

        <td>Recycling and green waste</td>
      </tr>

        <td>Bayview</td>

        <td>Monday, odd weeks</td>

      </tr>

  <p><span style="color: #a3a8b4;">Put bins out by 6 AM on collection day. Collections can run until 7 PM.</span></p>
  <h2 id="taxes">Property taxes and payments</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" width="240" height="138">Property tax bills for the second half of the year were mailed on November 14. Payment is due by January 31. To set up a payment plan instead:</p>
  <ol>
    <li>Sign in to the residents' portal.</li>
    <li>Select <strong>Property tax</strong>, then <strong>Payment plan</strong>.</li>
    <li>Choose weekly, biweekly or monthly installments.</li>
  </ol>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 65.7%;"><col style="width: 34.3%;"></colgroup>

      <tr>
        <th>Payment option</th>
        <th>Processing time</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Direct debit</td>
        <td>Same business day</td>
      </tr>
      <tr>

        <td>1 business day</td>
      </tr>
      <tr>
        <td>In person at a customer service center</td>
        <td>Same business day</td>
      </tr>
    </tbody>
  </table>
  <h2>Register your dog</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-husky.jpg" alt="tiny-husky.jpg" width="160" height="160">All dogs over three months old must be registered by March 1. Registration fees fund the off-leash parks at Bayview Point and Mill Creek.</p>
  <p><span style="color: #6b7280;">Spayed or neutered dogs, and dogs owned by seniors, qualify for a 50% discount.</span></p>
  <h2>Parks and trails</h2>
  <p>The Harborside coastal bike path opens on December 13. The 6-mile path follows the shoreline from Bayview Point to the ferry terminal, with water fountains and bike repair stations along the way.</p>

  <h2 id="taxes">Libraries and pools</h2>
  <p><strong>Summer pool hours</strong></p>
  <p>Port Ellery Aquatic Center opens from 5:30 AM to 9 PM every day between December 1 and February 28. Lap lanes can be booked up to seven days ahead.</p>
  <h3>Central Library coding club</h3>
  <p><img src="https://www.tiny.cloud/images/medium-pic.jpg" alt="A laptop showing program code on a white desk, next to a coffee cup, headphones, a phone and a potted plant, from the coding club flyer" width="640" height="190"></p>
  <p>The Central Library coding club for ages 12 to 17 restarts on February 3. Places are limited to 16 per session, so book early.</p>
  <p><span style="font-size: 26px; color: #f4a261;">Have your say on the new library opening hours by December 20.</span></p>
  <p>Port Ellery City Council, Customer Service: (555) 010-0199</p>

<h3>Enhanced Code Editor plugin</h3>

<textarea id="advcode">
  <blockquote>
    <p><strong>Try it:</strong> select <strong>Source code</strong> in the toolbar. The HTML opens in place of the editor content, formatted and color highlighted, with line numbers and matching tags.</p>
    <ul>
      <li>Click the arrow next to the line number of a <code>table</code> or <code>ol</code> element to fold it.</li>
      <li>Press <strong>Ctrl+F</strong> (<strong>Command+F</strong> on macOS) to search and replace, or select a word and press <strong>Ctrl+D</strong> (<strong>Command+D</strong>) to select its next occurrence and edit both at once.</li>
      <li>Select <strong>Dark/light mode</strong>, <strong>Increase font size</strong> or <strong>Fullscreen</strong>, then select <strong>Save code</strong> to apply any changes.</li>
    </ul>
  </blockquote>
  <h1>Set up two-step verification</h1>
  <p>Two-step verification protects an account with a second check after the password. Once it is on, signing in from a new device requires a code from a phone or a security key.</p>
  <h2>Turn it on</h2>
  <ol>
    <li>Open <strong>Settings</strong> and select <strong>Security</strong>.</li>
    <li>Under <strong>Two-step verification</strong>, select <strong>Get started</strong>.</li>
    <li>Choose a method:
      <ul>
        <li><strong>Authenticator app</strong>: scan the QR code with the app.</li>
        <li><strong>Text message</strong>: enter a mobile number to receive codes.</li>
        <li><strong>Security key</strong>: insert the key and touch it when prompted.</li>
      </ul>
    </li>
    <li>Enter the code shown by the chosen method and select <strong>Verify</strong>.</li>
  </ol>
  <h2>Compare the methods</h2>
  <table>
    <thead>
      <tr>
        <th scope="col">Method</th>
        <th scope="col">Works offline</th>
        <th scope="col">Setup time</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Authenticator app</td>
        <td>Yes</td>
        <td>2 minutes</td>
      </tr>
      <tr>
        <td>Text message</td>
        <td>No</td>
        <td>1 minute</td>
      </tr>
      <tr>
        <td>Security key</td>
        <td>Yes</td>
        <td>3 minutes</td>
      </tr>
    </tbody>
  </table>
  <h2>Keep the backup codes</h2>
  <p>Setup ends with ten single-use backup codes. Store them somewhere safe, such as a password manager, to sign in if the phone or key is lost. For more help, see the <a href="https://www.example.com/help/account-recovery">account recovery guide</a>.</p>
</textarea>

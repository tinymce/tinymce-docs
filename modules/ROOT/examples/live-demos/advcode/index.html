  <h1>Deposit checks with the mobile app</h1>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop on a wooden table, next to two smartphones and a cup of coffee" width="240" height="138">Northfield Community Bank customers can deposit a check from anywhere with the Northfield mobile app. There is no fee, and most deposits made before 8 PM Eastern Time are credited the same business day.</p>
  <h2>Make a deposit</h2>
  <ol>
    <li>Sign the back of the check and write <strong>For mobile deposit only at Northfield Community Bank</strong> under the signature.</li>
    <li>Open the app, select <strong>Deposit</strong>, then choose the account.</li>
    <li>Take a photo of each side of the check:
      <ul>
        <li>Place the check on a dark, flat surface in good light.</li>
        <li>Keep all four corners inside the frame.</li>
        <li>Hold the phone directly above the check, not at an angle.</li>
      </ul>
    </li>
    <li>Enter the amount, review the details, and select <strong>Submit</strong>.</li>
  </ol>

  <h2>When the money is available</h2>
  <p>The first $225 of a deposit is available the next business day. The rest is usually available within two business days. Keep the paper check for 14 days, then shred it.</p>
  <p>For help with a deposit, call (555) 010-0199, Monday to Friday from 7 AM to 9 PM, or read the <a href="https://www.example.com/">mobile deposit agreement</a>.</p>

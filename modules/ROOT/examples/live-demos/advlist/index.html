  <h1>Harbor Community Garden Association bylaws</h1>
  <p>Draft for the annual general meeting. Articles use Roman numerals, sections use capital letters, and clauses use lowercase letters and lowercase Roman numerals.</p>
  <ol style="list-style-type: upper-roman;">
    <li>Name and purpose
      <ol style="list-style-type: upper-alpha;">
        <li>The association is called the Harbor Community Garden Association.</li>
        <li>The association manages the garden on Harbor Road for the benefit of local residents.</li>
      </ol>
    </li>
    <li>Membership
      <ol style="list-style-type: upper-alpha;">
        <li>Eligibility
          <ol style="list-style-type: lower-alpha;">
            <li>Any resident of the Harbor district may apply for membership.</li>
            <li>Applicants must provide:
              <ol style="list-style-type: lower-roman;">
                <li>proof of address;</li>
                <li>a signed copy of the garden rules; and</li>
                <li>the first year of dues.</li>
              </ol>
            </li>
          </ol>
        </li>
        <li>Annual dues are set at the annual general meeting.</li>
      </ol>
    </li>
    <li>Meetings
      <ol style="list-style-type: upper-alpha;">
        <li>The annual general meeting is held each March.</li>
        <li>The order of business is:
          <ol>
            <li>Approval of the previous minutes</li>
            <li>Treasurer&rsquo;s report</li>
            <li>Election of the committee</li>
            <li>Other business</li>
          </ol>
        </li>
      </ol>
    </li>
  </ol>
  <h2>Schedule A: plot types</h2>
  <ol style="list-style-type: lower-greek;">
    <li>Standard plot, 3 by 6 meters</li>
    <li>Raised bed, 1.2 by 2.4 meters</li>
    <li>Accessible plot with a wheelchair-height bed and paved path</li>
  </ol>
  <h2>Schedule B: plot holder responsibilities</h2>
  <ul style="list-style-type: disc;">
    <li>Keep the plot planted and free of weeds from April to October.
      <ul style="list-style-type: circle;">
        <li>Plots left unplanted for eight weeks may be reassigned.
          <ul style="list-style-type: square;">
            <li>The committee sends a written reminder before reassigning a plot.</li>
          </ul>
        </li>
      </ul>
    </li>
    <li>Share the communal tools and return them to the shed after use.</li>
    <li>Attend at least two work days each season.</li>
  </ul>

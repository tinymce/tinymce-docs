<textarea id="advlist-demo">
  <h1>Cascade Air conditions of carriage: baggage</h1>
  <p>These conditions apply to all flights operated by Cascade Air from January 1. Articles use Roman numerals, sections use capital letters, clauses use lowercase letters, and sub-clauses use lowercase Roman numerals.</p>
  <ol style="list-style-type: upper-roman;">
    <li>Carry-on baggage
      <ol style="list-style-type: upper-alpha;">
        <li>Each passenger may bring one carry-on bag and one personal item on board.</li>
        <li>The carry-on bag must not exceed 22 x 14 x 9 inches, including wheels and handles.</li>
        <li>Personal items include:
          <ol style="list-style-type: lower-alpha;">
            <li>a purse, laptop bag or small backpack that fits under the seat;</li>
            <li>a coat or umbrella; and</li>
            <li>assistive devices, which do not count toward the allowance.</li>
          </ol>
        </li>
      </ol>
    </li>
    <li>Checked baggage
      <ol style="list-style-type: upper-alpha;">
        <li>Allowances depend on the fare type, as shown in Schedule A.</li>
        <li>Overweight bags
          <ol style="list-style-type: lower-alpha;">
            <li>A bag that weighs between 51 and 70 pounds is charged $100 each way.</li>
            <li>A bag that weighs more than 70 pounds is not accepted, unless:
              <ol style="list-style-type: lower-roman;">
                <li>it contains mobility or medical equipment; or</li>
                <li>it is approved in advance by Special Services at (555) 010-0177.</li>
              </ol>
            </li>
          </ol>
        </li>
      </ol>
    </li>
    <li>Delayed and damaged baggage
      <ol>
        <li>Report a delayed bag at the arrival airport before leaving the baggage claim area.</li>
        <li>Report damage within seven days of receiving the bag.</li>
        <li>Reimbursement for essential items is limited to:
          <ol>
            <li>$50 per day for the first five days; and</li>
            <li>receipted purchases only.</li>
          </ol>
        </li>
      </ol>
    </li>
  </ol>
  <h2>Schedule A: checked baggage allowance</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 24.2%;"><col style="width: 30.6%;"><col style="width: 45.2%;"></colgroup>
    <thead>
      <tr><th>Fare type</th><th>Bags included</th><th>Maximum weight per bag</th></tr>
    </thead>
    <tbody>
      <tr><td>Basic</td><td>0</td><td>50 pounds</td></tr>
      <tr><td>Standard</td><td>1</td><td>50 pounds</td></tr>
      <tr><td>Flex</td><td>2</td><td>50 pounds</td></tr>
      <tr><td>Business</td><td>2</td><td>70 pounds</td></tr>
    </tbody>
  </table>
  <h2>Schedule B: items not accepted in checked baggage</h2>
  <ul style="list-style-type: square;">
    <li>Spare lithium batteries and power banks
      <ul style="list-style-type: disc;">
        <li>Carry these in the cabin instead, with the terminals taped over.</li>
      </ul>
    </li>
    <li>Electronic cigarettes and vaping devices</li>
    <li>Cash, jewelry, keys and medication</li>
  </ul>
</textarea>

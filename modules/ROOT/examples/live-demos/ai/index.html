  <h1>Water damage: a guide for homeowners</h1>
  <p>This guide explains when Cedar Mutual homeowners policies pay for water damage, and what to do in the first 48 hours after a leak. It is a draft for the customer help center and will be reviewed by the claims team on December 10.</p>
  <h2>Policy wording</h2>
  <p>We will pay for direct physical loss to the dwelling caused by the sudden and accidental discharge or overflow of water or steam from within a plumbing, heating, air conditioning or automatic fire protective sprinkler system, or from within a household appliance, including the cost of tearing out and replacing any part of the dwelling necessary to repair the system or appliance from which the water or steam escaped, but excluding loss to the system or appliance itself and excluding loss resulting from continuous or repeated seepage or leakage of water or steam over a period of 14 or more days.</p>
  <h2>Covered and not covered</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 53.9%;"><col style="width: 46.1%;"></colgroup>
    <thead>
      <tr>
        <th>Situation</th>
        <th>Usually covered</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>A washing machine hose bursts and floods the laundry room</td>
        <td>Yes</td>
      </tr>
      <tr>
        <td>A slow leak under the kitchen sink rots the cabinet over several months</td>
        <td>No</td>
      </tr>
      <tr>
        <td>Heavy rain floods the basement from outside</td>
        <td>No, unless flood coverage was added</td>
      </tr>
    </tbody>
  </table>
  <h2>What to do after a leak</h2>
  <ol>
    <li>Turn off the water supply at the main valve.</li>
    <li>Take photos of the damage before cleaning up.</li>
    <li>Call the 24-hour claims line at (555) 010-0199 within 48 hours.</li>
  </ol>

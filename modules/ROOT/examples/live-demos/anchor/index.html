  <h2><a id="working-hours"></a>Working hours</h2>
  <p>Core hours are 10 am to 4 pm, Monday to Friday. Staff can start at any time between 7 am and 10 am and finish after 7.5 hours of work, plus a lunch break of at least 30 minutes.</p>
  <p><a href="#top">Back to top</a></p>
  <h2><a id="leave"></a>Leave</h2>
  <p>Full-time staff receive the following paid leave each year, in addition to public holidays. Part-time staff receive a pro rata amount.</p>
  <ul>
    <li>Vacation: 25 days, requested at least two weeks in advance.</li>
    <li>Sick leave: 10 days, with a medical certificate required after three consecutive days.</li>
    <li>Volunteering leave: 2 days for approved community projects.</li>
  </ul>
  <p><a href="#top">Back to top</a></p>
  <h2><a id="expenses"></a>Expenses</h2>
  <p>Submit receipts within 30 days of purchase. Any single purchase over 500 dollars needs written approval from a line manager before it is made. Mileage is reimbursed at 0.65 dollars per mile.</p>
  <p><a href="#top">Back to top</a></p>
  <h2><a id="equipment"></a>Equipment and IT</h2>
  <p>Every staff member receives a laptop, a monitor and a headset. Laptops are replaced every three years, and the IT help desk handles repairs and software requests.</p>

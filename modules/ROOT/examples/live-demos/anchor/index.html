  <h2><a id="check-in"></a>Check-in and checkout</h2>
  <p>Check-in starts at 3 PM and checkout is at 11 AM. Guests who need a late checkout until 1 PM can request one from the front desk, subject to availability. Luggage storage is free on the day of departure.</p>
  <p><a href="#top">Back to top</a></p>
  <h2><a id="dining"></a>Dining</h2>
  <p>The Lakeside Grill serves breakfast from 6:30 AM to 10:30 AM and dinner from 5 PM to 10 PM. Room service is available from 6:30 AM to midnight.</p>
  <ul>
    <li>Breakfast is included with every Lake View and Suite booking.</li>
    <li>Dinner reservations are recommended on Friday and Saturday.</li>
    <li>The lobby coffee bar opens at 6 AM.</li>
  </ul>
  <p><a href="#top">Back to top</a></p>
  <h2><a id="wifi"></a>Wi-Fi and business center</h2>
  <p>Connect to the <strong>Lakeview-Guest</strong> network and enter the last name on the booking and the room number. The business center next to the lobby has two computers and a printer, open 24 hours with a room key.</p>
  <p><a href="#top">Back to top</a></p>
  <h2><a id="pool"></a>Pool and fitness center</h2>
  <p>The indoor pool and hot tub are open from 6 AM to 11 PM. Children under 14 must be accompanied by an adult. The fitness center on the lower level is open 24 hours.</p>
  <p><a href="#top">Back to top</a></p>
  <h2>Parking</h2>
  <p>Self-parking in the north lot costs $15 per night. Valet parking costs $28 per night, with unlimited in-and-out access. Electric vehicle chargers are available in the first row of the north lot.</p>

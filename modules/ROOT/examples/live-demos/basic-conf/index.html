  <h1>Member handbook: The Hive Coworking</h1>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop next to a smartphone and a cup of coffee" width="200" height="115">Welcome to The Hive. This handbook covers building access, Wi-Fi, meeting rooms, and kitchen etiquette. The front desk is staffed weekdays from 8 AM to 6 PM.</p>
  <h2>Getting online</h2>
  <p>Connect to the <strong>Hive-Guest</strong> network and sign in with the email address on your membership. Printers on every floor are also on Hive-Guest.</p>
  <p>Visitors can use Hive-Guest for one day. Ask the front desk for a visitor pass.</p>
  <h2>Booking meeting rooms</h2>
  <ol>
    <li>Open the member app and select <strong>Rooms</strong>.</li>
    <li>Pick a room and a time slot, up to 14 days ahead.</li>
    <li>Cancel at least 2 hours before the booking to get your credits back.</li>
  </ol>

  <h2>Kitchen</h2>
  <p>Coffee and tea are free. Label food in the shared fridge with your name and date. The fridge is cleared every Friday at 4 PM.</p>
  <p>Questions? Call the front desk at (555) 010-0127.</p>

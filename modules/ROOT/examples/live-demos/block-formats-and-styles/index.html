<textarea id="block-formats-and-styles">
  <h1>Assembling the Halden three-drawer dresser</h1>
  <p class="lead">Two adults can assemble the Halden dresser in about 90 minutes. Read every step before starting, and keep the hardware bags sealed until the step that uses them.</p>
  <div class="safety-warning">
    <p><strong>Tip-over hazard.</strong> An unsecured dresser can tip over and cause serious injury. Fasten the dresser to the wall with the anti-tip strap <span class="part-number">H-06</span> before filling the drawers.</p>
  </div>
  <h2>Parts and hardware</h2>
  <table style="border-collapse: collapse; width: 100%;" class="striped" border="1">
    <colgroup><col style="width: 18.8%;"><col style="width: 59.4%;"><col style="width: 21.8%;"></colgroup>
    <thead>
      <tr><th>Part</th><th>Description</th><th>Quantity</th></tr>
    </thead>
    <tbody>
      <tr><td><span class="part-number">A-01</span></td><td>Side panel</td><td>2</td></tr>
      <tr><td><span class="part-number">A-02</span></td><td>Top panel</td><td>1</td></tr>
      <tr><td><span class="part-number">A-03</span></td><td>Base rail</td><td>1</td></tr>
      <tr><td><span class="part-number">B-01</span></td><td>Back panel</td><td>1</td></tr>
      <tr><td><span class="part-number">C-01</span></td><td>Drawer front</td><td>3</td></tr>
      <tr><td><span class="part-number">H-01</span></td><td>Wooden dowel, <span class="measurement">8 mm</span></td><td>16</td></tr>
      <tr><td><span class="part-number">H-02</span></td><td>Cam lock screw</td><td>12</td></tr>
      <tr><td>H-04</td><td>Drawer runner, left and right</td><td>3 pairs</td></tr>
      <tr><td><span class="part-number">H-06</span></td><td>Anti-tip strap with wall bracket</td><td>1</td></tr>
    </tbody>
  </table>
  <p>The drawer runners H-04 ship in a separate box and can arrive up to five days after the main carton.</p>
  <h2>Instructions</h2>
  <h3>Step 1: Attach the base rail</h3>
  <p>Lay side panel <span class="part-number">A-01</span> flat on a soft surface with the predrilled holes facing up. Push four dowels <span class="part-number">H-01</span> into the holes, then fit base rail <span class="part-number">A-03</span> over the dowels.</p>
  <p class="tip">Tip: Tap the dowels in with a rubber mallet. A metal hammer can split the wood.</p>
  <h3>Step 2: Fit the top and back panels</h3>
  <ol>
    <li>Attach the second side panel to the other end of the base rail.</li>
    <li>Lower top panel <span class="part-number">A-02</span> onto the side panels and turn each cam lock screw <span class="part-number">H-02</span> clockwise until it stops.</li>
    <li>Slide back panel <span class="part-number">B-01</span> into the grooves from the top.</li>
  </ol>
  <p>Step 3: Install the drawer runners</p>
  <p>Screw one runner from each pair H-04 to the inside of each side panel, with the wheel at the front. Leave a gap of <span class="measurement">2 mm</span> between the runner and the front edge, and check that each pair is level before tightening the screws.</p>
  <p>Tip: Install the bottom runners first. The lower drawer is easier to align when the upper runners are not yet in place.</p>
  <h3>Step 4: Secure the dresser to the wall</h3>
  <p>Screw the wall bracket of anti-tip strap <span class="part-number">H-06</span> into a wall stud, then clip the strap to the back of the top panel. For help with assembly, call (555) 010-0199, Monday to Friday, 8:00 AM to 6:00 PM.</p>
</textarea>

  <h1>Quarterly investor letter: headline review</h1>
  <p>Fund managers file their section headlines in whatever case they were typed in. The communications team fixes the case before the letter goes to clients on January 8.</p>
  <h2>House style</h2>
  <ul>
    <li>Use title case for every headline.</li>
    <li>Keep articles, conjunctions, and prepositions of three letters or fewer in lowercase, unless they start the headline.</li>
    <li>Capitalize every word of four letters or more, including prepositions such as <em>with</em> and <em>from</em>.</li>
  </ul>

    <p><strong>Try it:</strong> select text, then open the <strong>Capitalization</strong> drop-down in the toolbar and choose a case.</p>

      <li>Select all four headline drafts and choose <strong>Title Case</strong>. The desk uses a custom list of minor words, so short words such as <em>of</em>, <em>to</em>, and <em>an</em> stay lowercase while longer prepositions such as <em>With</em>, <em>From</em>, and <em>Into</em> are capitalized.</li>

  <h1>Copy desk: Saturday edition headline queue</h1>
  <p>Headlines filed by reporters arrive in whatever case they were typed in. Fix the case before the pages go to layout at 6 p.m.</p>
  <h2>House style for headlines</h2>
  <ul>
    <li>Use title case for all headlines.</li>
    <li>Keep articles, coordinating conjunctions, and prepositions of three letters or fewer in lowercase, unless they start the headline.</li>
    <li>Capitalize every word of four letters or more.</li>
  </ul>

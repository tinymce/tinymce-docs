  <h1>A weekend in Harbor Falls</h1>
  <p>Harbor Falls sits where the Ostrander River meets the bay, two hours north of the city by car or train. This guide covers the best of the town in two days, from the riverside trail to the Saturday market on Kittredge Square.</p>
  <h2>Saturday</h2>
  <h3>Morning: the river trail</h3>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/adventure-bikers-bikes-163407_thumb.jpg" alt="Two cyclists riding along a dirt road beside a river, with green hills behind them" width="240" height="160">The Ostrander River Trail runs 9 miles from the train station to the lighthouse. It is flat, paved, and shared by walkers and cyclists. Bikes rent from $25 a day at the station, and helmets are free.</p>
  <h3>Afternoon: Kittredge Square market</h3>
  <p>More than 60 stalls sell local cheese, smoked fish, honey, and crafts every Saturday from 9 AM to 2 PM. Bring cash for the smaller vendors.</p>
  <h2>Sunday</h2>
  <ol>
    <li>Watch the sunrise from the lighthouse lookout, open from 6 AM. The lookout has a seperate entrance from the museum.</li>
    <li>Take the 10 AM harbor cruise, which runs 90 minutes and costs $32 for adults.</li>
    <li>Finish with lunch at one of the seafood restaurants on Wharf Street.</li>
  </ol>

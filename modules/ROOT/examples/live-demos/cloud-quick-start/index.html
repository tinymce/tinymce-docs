  <h1>Boat rentals return to Mirror Lake on Saturday</h1>
  <p><em>Posted December 4 by Jenna Ruiz, Lakeview Gazette</em></p>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/boat-daylight-lake-675764_thumb.jpg" alt="The bow of a wooden rowboat with an oar resting on the side, on a calm lake below rocky mountains" width="240" height="160">The boathouse at Mirror Lake reopens on Saturday, December 13, after a three-month repair of the dock and launch ramp. The city replaced 140 feet of decking and added a wider ramp that meets accessibility standards.</p>
  <p>Rowboats and kayaks can be rented from 9 AM to 5 PM on weekends, and from 11 AM to 4 PM on weekdays when the weather allows. Life jackets are included with every rental.</p>

  <h2>Before heading out</h2>
  <ul>
    <li>Children under 12 must wear a life jacket and ride with an adult.</li>
    <li>Swimming from boats is not allowed.</li>
    <li>The last rental goes out one hour before closing.</li>
  </ul>
  <p>For group bookings, call the Parks Department at (555) 010-0163 or visit the <a href="https://www.example.com/">Mirror Lake boathouse page</a>.</p>

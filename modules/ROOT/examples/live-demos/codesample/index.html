  <h1>Verifying webhook signatures</h1>
  <p>Every webhook request includes an <code>X-Signature</code> header. The header value is a hex-encoded HMAC-SHA256 digest of the raw request body, signed with the endpoint's signing secret.</p>
  <p>To confirm that a request is genuine, compute the same digest from the raw body before parsing it, then compare the two values with a constant-time comparison. A plain string comparison can leak timing information.</p>
  <h2>Node.js</h2>
<pre class="language-javascript"><code>import crypto from 'node:crypto';

export function verifySignature(rawBody, signature, secret) {
  const expected = crypto
    .createHmac('sha256', secret)
    .update(rawBody)
    .digest();
  const received = Buffer.from(signature, 'hex');
  return expected.length === received.length &amp;amp;&amp;amp;
    crypto.timingSafeEqual(expected, received);
}</code></pre>
  <h2>Python</h2>
<pre class="language-python"><code>import hashlib
import hmac


def verify_signature(raw_body: bytes, signature: str, secret: str) -&amp;gt; bool:
    expected = hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()
    return hmac.compare_digest(expected, signature)</code></pre>
  <h2>PHP</h2>
<pre class="language-php"><code>&amp;lt;?php

function verify_signature(string $rawBody, string $signature, string $secret): bool
{
    $expected = hash_hmac('sha256', $rawBody, $secret);
    return hash_equals($expected, $signature);
}</code></pre>
  <h2>Ruby</h2>
<pre class="language-ruby"><code>require 'openssl'

def verify_signature(raw_body, signature, secret)
  expected = OpenSSL::HMAC.hexdigest('SHA256', secret, raw_body)
  OpenSSL.secure_compare(expected, signature)
end</code></pre>
  <h2>C#</h2>
<pre class="language-csharp"><code>using System;
using System.Security.Cryptography;
using System.Text;

public static class WebhookSignature
{
    public static bool Verify(byte[] rawBody, string signature, string secret)
    {
        using var hmac = new HMACSHA256(Encoding.UTF8.GetBytes(secret));
        byte[] expected = hmac.ComputeHash(rawBody);
        byte[] received = Convert.FromHexString(signature);
        return CryptographicOperations.FixedTimeEquals(expected, received);
    }
}</code></pre>
  <p>Reject any request whose signature does not match with a <code>401</code> response, and do not process its payload.</p>

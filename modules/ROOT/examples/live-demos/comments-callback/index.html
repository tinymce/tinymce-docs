  <h1>Pine Ridge State Forest reopens most trails after October windstorm</h1>
  <p><em>By Daniel Long, staff reporter. Updated November 25 at 4:30 PM.</em></p>
  <p><strong>PINE RIDGE</strong> — Hikers can return to <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_trail-miles" data-mce-annotation="tinycomments">14 miles of trail</span> in Pine Ridge State Forest starting Saturday, December 6, five weeks after an October 28 windstorm brought down more than 2,000 trees across the park.</p>
  <p>Crews from the state Department of Natural Resources and two volunteer groups cleared the four main trails over the past month. <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_ranger-quote" data-mce-annotation="tinycomments">"We moved more fallen timber in four weeks than we normally do in four years," said Lead Ranger Marisol Ortiz.</span></p>

  <p>The Falls Overlook Trail ends at a <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_file-photo" data-mce-annotation="tinycomments">viewpoint over the Clearwater Valley</span>, one of the most photographed spots in the state. The wooden viewing platform lost its railing in the storm and will stay fenced off until a contractor replaces it in January.<img style="display: block; margin-left: auto; margin-right: auto;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/forest-landscape-mountain-range-129105_thumb.jpg" alt="A forested valley with distant mountains under a blue sky" width="220" height="147"></p>
  <p>The Hemlock Ravine Trail stays closed because several large trees are still hanging over the path. Rangers say the trail will not reopen before the ground dries out in April.</p>
  <h2>What visitors need to know</h2>
  <ul>
    <li>Parking at the North Gate lot is limited to 60 cars until the overflow lot is regraded.</li>
    <li>Dogs must stay on a leash no longer than 6 feet.</li>
    <li>Campgrounds stay closed until April 1.</li>
  </ul>
  <p>Check trail conditions before setting out on the <a href="https://www.example.com/">state parks website</a>, or call the North Gate ranger station at (555) 010-0142.</p>

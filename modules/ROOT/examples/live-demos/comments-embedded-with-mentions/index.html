  <h1>Campaign brief: Brew at Home winter launch</h1>
  <p><strong>Client:</strong> Cedar &amp; Steam Coffee Roasters<br><strong>Campaign owner:</strong> <span class="mymention" data-mention-id="william-patterson">@William Patterson</span><br><strong>Design lead:</strong> <span class="mymention" data-mention-id="zara-khan">@Zara Khan</span><br><strong>Launch date:</strong> January 12<br><strong>Budget:</strong> $85,000</p>
  <h2>Objective</h2>
  <p>Launch the Brew at Home stovetop espresso kit to existing customers and to coffee drinkers aged 25 to 44 who make coffee at home. The goal is <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_sales-target" data-mce-annotation="tinycomments">2,500 kit sales in the first eight weeks</span>, with at least 30% of buyers signing up for a monthly bean subscription.<img style="display: block; margin-left: auto; margin-right: auto;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/aluminium-antique-coffee-6255_thumb.jpg" alt="A silver stovetop espresso maker on a gas burner in front of weathered blue and white boards" width="220" height="147"></p>
  <h2>Key message</h2>
  <p><strong>Café-quality espresso on the stove you already own, in five minutes.</strong></p>

  <h1>Digital Skills for Older Adults: grant proposal</h1>
  <p><strong>Applicant:</strong> Riverside Public Library<br><strong>Funder:</strong> Hartwell Community Foundation, Community Learning Fund<br><strong>Amount requested:</strong> $48,500 over 12 months<br><strong>Submission deadline:</strong> December 15</p>
  <h2>Summary</h2>
  <p>Riverside Public Library requests $48,500 to run free, small-group technology classes for residents aged 60 and over. Over 12 months, the program will teach <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_learner-target" data-mce-annotation="tinycomments">320 older adults</span> to use email, video calls, online banking and telehealth portals safely.<img style="display: block; margin-left: auto; margin-right: auto;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop next to a smartphone and a cup of coffee" width="200" height="115"></p>
  <h2>Need</h2>
  <p>In a library survey of 412 patrons over 60, 58% said they had missed a medical appointment or a bill payment because they could not use an online service. The waiting list for our drop-in help sessions averages three weeks.</p>
  <h2>Program activities</h2>
  <ol>
    <li>A six-week beginner course with two 90-minute classes a week and 8 learners per class</li>
    <li>Monthly scam awareness workshops run with the Riverside Police Department</li>
    <li>Loans of 40 tablets with data plans for learners without a device at home</li>
    <li><span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_volunteers" data-mce-annotation="tinycomments">One-on-one follow-up sessions with trained volunteers</span></li>
  </ol>
  <h2>Budget</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 78.7%;"><col style="width: 21.3%;"></colgroup>
    <thead>
      <tr>
        <th>Item</th>
        <th>Cost</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Instructor wages, two part-time instructors</td>
        <td>$24,000</td>
      </tr>
      <tr>
        <td>Tablets and data plans, 40 devices</td>
        <td>$14,400</td>
      </tr>
      <tr>
        <td>Volunteer training and background checks</td>
        <td>$3,600</td>
      </tr>
      <tr>
        <td>Printed course materials</td>
        <td>$2,500</td>
      </tr>
      <tr>
        <td><span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_evaluation-cost" data-mce-annotation="tinycomments">Evaluation by an external consultant</span></td>
        <td>$4,000</td>
      </tr>
      <tr>
        <td><strong>Total</strong></td>
        <td><strong>$48,500</strong></td>
      </tr>
    </tbody>
  </table>
  <h2>Outcomes</h2>
  <ul>
    <li>At least 80% of learners complete the six-week course.</li>
    <li>At least 70% of learners use one new online service on their own three months after the course.</li>
  </ul>
  <p>Contact: Nicholas Butler, Grants Coordinator, (555) 010-0187. This proposal follows the <a href="https://www.example.com/">Community Learning Fund guidelines</a>.</p>

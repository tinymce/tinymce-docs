  <h1>Remote work and equipment policy</h1>
  <p><strong>Policy owner:</strong> Human Resources<br><strong>Version:</strong> 3.2, approved November 18<br><strong>Effective:</strong> January 1<br><strong>Applies to:</strong> All full-time and part-time employees</p>
  <h2>1. Eligibility</h2>
  <p>Employees can work remotely <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_eligibility" data-mce-annotation="tinycomments">up to three days a week</span> once they complete their 90-day introductory period, with their manager's approval. Roles that need on-site equipment, such as laboratory and facilities roles, are not eligible.</p>
  <h2>2. Equipment</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 27.4%;"><col style="width: 48.4%;"><col style="width: 24.2%;"></colgroup>
    <thead>
      <tr>
        <th>Item</th>
        <th>Provided by</th>
        <th>Replacement cycle</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Laptop</td>
        <td>Company</td>
        <td>Every 3 years</td>
      </tr>
      <tr>
        <td>One external monitor</td>
        <td>Company</td>
        <td>Every 5 years</td>
      </tr>
      <tr>
        <td>Headset</td>
        <td>Company</td>
        <td>Every 2 years</td>
      </tr>
      <tr>
        <td>Desk and chair</td>
        <td>Employee, with a <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_allowance" data-mce-annotation="tinycomments">one-time $400 allowance</span></td>
        <td>Not replaced</td>
      </tr>
    </tbody>
  </table>
  <h2>3. Security requirements</h2>
  <ol>
    <li>Connect to all work systems through the company VPN.</li>
    <li><span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_screen-lock" data-mce-annotation="tinycomments">Lock the screen when stepping away, even at home.</span></li>
    <li>Report a lost or stolen device to the IT service desk within 24 hours by calling (555) 010-0110.</li>
  </ol>
  <h2>4. Expenses</h2>
  <p>Home internet costs are not reimbursed. Employees who work remotely three days a week can claim up to $50 a month toward a phone plan through the <a href="https://www.example.com/">expenses portal</a>.</p>

  <h1>Shift length and next-day reaction time in hospital nurses: a cross-sectional study</h1>
  <p><em>Manuscript WHS-2026-0417, submitted to the Journal of Workplace Health Studies. Under peer review.</em></p>
  <h2>Abstract</h2>
  <p>We measured psychomotor vigilance in <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_recruitment" data-mce-annotation="tinycomments">212 registered nurses</span> at three hospitals after 8-hour and 12-hour shifts. Mean reaction time was 41 ms slower after 12-hour shifts (95% CI 29 to 53 ms), and the effect remained after adjusting for age, sleep duration and caffeine intake.</p>
  <h2>Methods</h2>
  <p>Participants completed a 5-minute psychomotor vigilance test (PVT) on a tablet within 30 minutes of finishing a shift. A lapse was defined as a response slower than 500 ms. Shift length was taken from hospital rosters for the 14 days before testing.</p>
  <h2>Results</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 20.9%;"><col style="width: 20.9%;"><col style="width: 33.7%;"><col style="width: 24.5%;"></colgroup>

    <tbody>

      </tr>
      <tr>
        <td>12 hours</td>
        <td>94</td>

        <td>4.6</td>
      </tr>
    </tbody>
  </table>
  <p>Lapses <span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_lapse-analysis" data-mce-annotation="tinycomments">more than doubled after 12-hour shifts</span>, and nurses in their third consecutive 12-hour shift recorded the slowest reaction times.</p>
  <h2>Limitations</h2>
  <ul>
    <li>Shift length was not randomly assigned.</li>
    <li>Caffeine intake was self-reported.</li>
    <li><span class="mce-annotation tox-comment" data-mce-annotation-uid="mce-conversation_shift-timing" data-mce-annotation="tinycomments">Day and night shifts were analyzed together.</span></li>
  </ul>
  <p>The data and analysis code are available in the <a href="https://www.example.com/">project repository</a>.</p>

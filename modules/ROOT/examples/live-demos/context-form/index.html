  <h1>Reset two-step verification for a team member</h1>
  <p><strong>Draft</strong> for the Help Center, Account security section. Owner: Jordan Patel. Last reviewed on November 30.</p>
  <p>Use this procedure when a team member replaces a phone and can no longer sign in with an authenticator app. Only workspace administrators can reset two-step verification.</p>
  <h2>Before you start</h2>
  <ul>
    <li>Confirm the request by phone, using the number on file in the <a href="https://www.example.com/admin/people">People directory</a>.</li>
    <li>Check the <a href="https://www.example.com/admin/audit-log">audit log</a> for sign-in attempts from unknown locations.</li>
  </ul>
  <h2>Reset steps</h2>
  <ol>
    <li>Open <strong>Admin</strong> &gt; <strong>People</strong> and select the team member.</li>
    <li>Select <strong>Security</strong>, then <strong>Reset two-step verification</strong>.</li>
    <li>Tell the team member to sign in within 24 hours and set up a new authenticator app.</li>
  </ol>
  <h2>Related articles</h2>
  <ul>
    <li><a href="https://www.example.com/help/recovery-codes">Generate recovery codes</a></li>
    <li><a href="https://www.example.com/help/security-keys">Sign in with a hardware security key</a></li>
  </ul>
  <p>Still stuck? Contact the Identity team at (555) 010-0163, 8:00 AM to 6:00 PM Eastern Time.</p>

  <h1>Onboarding wiki: Customer Support team</h1>
  <p>Welcome to the team. This page lists everything a new support specialist needs in the first week. Keep it open on day one and work through it from top to bottom.</p>
  <h2>Meet your onboarding buddy</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/unsplash/uifaces-unsplash-portrait-Natali_Craig.jpg" alt="Portrait of Natalie Craig, a woman with long brown hair in a striped shirt, outdoors at sunset" width="120" height="120">Natalie Craig has worked on the support team for four years and leads the billing queue. She sits with new hires for their first ten tickets and answers questions in the <a href="https://www.example.com/chat/support-new-hires">#support-new-hires</a> channel. Book a 30-minute welcome call with her on Monday afternoon.</p>
  <h2>Tools to set up</h2>
  <ul>
    <li><a href="https://www.example.com/it/laptop-setup">Laptop setup guide</a>: install the help desk app, the phone system, and the password manager.</li>
    <li><a href="https://www.example.com/hr/benefits">Benefits enrollment</a>: complete the form within 30 days of the start date.</li>
    <li><a href="https://www.example.com/support/style-guide">Support writing style guide</a>: read it before replying to a customer.</li>
  </ul>

  <h1>Customer success playbook: the first 90 days</h1>
  <p>This playbook covers the first three months of every new enterprise account. Customer success managers own each stage and record progress in the account plan.</p>
  <h2>Days 1 to 30: kickoff and setup</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop next to a smartphone and a cup of coffee on a wooden desk" width="240" height="138">Hold the kickoff call within five business days of the signed contract. Agree on three measurable goals with the customer's project lead, and book a weekly 30-minute check-in until setup is complete.</p>
  <ul>
    <li>Send the welcome pack and admin training invitations.</li>
    <li>Confirm the single sign-on settings with the customer's IT team.</li>
    <li>Import the customer's existing data and check record counts.</li>
  </ul>
  <h2>Days 31 to 60: adoption</h2>
  <p>Track weekly active users against the number of seats purchased. When fewer than 60% of seats are active, run a second training session for team leads.</p>
  <h2>Days 61 to 90: first business review</h2>
  <p>Present results against the three kickoff goals. Ask for a quote that the customer is happy to share with other teams. The best quotes are short and name a result, like this one from a pilot customer:</p>
  <p>Our support team answered tickets 40% faster in the first month, and we retired two old tools in the process. Every new team now asks to join the rollout.</p>

  <h1>Halden smart thermostat: frequently asked questions</h1>
  <p>Answers to the questions the support team hears most often. Last reviewed on November 19, 2026.</p>
  <h2>Setup</h2>
  <h3>Does the thermostat work without a C-wire?</h3>
  <p>Yes, with most gas and electric heating systems. Heat pumps and systems with more than two heating stages need a C-wire or the included power adapter.</p>
  <h3>How long does installation take?</h3>
  <p>Most installations take 30 to 45 minutes. The app shows a wiring diagram for the old thermostat model before any wires are removed.</p>
  <h2>Schedules and energy use</h2>
  <h3>Can different rooms follow different schedules?</h3>
  <p>Yes. Add up to six room sensors and assign each room its own schedule in <strong>Settings &gt; Rooms</strong>.</p>
  <h3>How much energy does Eco mode save?</h3>
  <p>In a 2026 study of 2,000 homes, Eco mode cut heating and cooling costs by an average of 12%. Savings depend on the climate and the size of the home.</p>

  <h2>Warranty and support</h2>
  <h3>What does the warranty cover?</h3>
  <p>The thermostat and sensors are covered for two years from the date of purchase. Call (555) 010-0199, Monday to Saturday, 7:00 AM to 7:00 PM Central.</p>

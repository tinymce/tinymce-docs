<textarea id="custom-toolbar-menu-button-search">
  <h1>Reset two-step verification on your account</h1>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop, with two phones and a coffee cup on the desk beside it" width="240" height="138">Two-step verification asks for a code from a phone or security key each time someone signs in on a new device. If the phone that receives the codes is lost or replaced, the verification method must be reset before signing in again.</p>
  <p><strong>Applies to:</strong> all plans | <strong>Last updated:</strong> November 20, 2026</p>
  <h2>Before you start</h2>
  <ul>
    <li>Have one of the ten backup codes saved when two-step verification was turned on.</li>
    <li>Make sure the new phone can receive text messages or has an authenticator app installed.</li>
  </ul>
  <h2>Reset with a backup code</h2>
  <ol>
    <li>On the sign-in page, enter the email address and password for the account.</li>
    <li>When asked for a verification code, select <strong>Use a backup code</strong>.</li>
    <li>Enter one backup code. Each code works only once.</li>
    <li>Go to <strong>Settings &gt; Security &gt; Two-step verification</strong> and select <strong>Change method</strong>.</li>
    <li>Follow the prompts to register the new phone or security key.</li>
  </ol>
  <h2>Verification methods</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 28.8%;"><col style="width: 23.8%;"><col style="width: 47.4%;"></colgroup>
    <thead>
      <tr><th>Method</th><th>Works offline</th><th>Recommended for</th></tr>
    </thead>
    <tbody>
      <tr><td>Authenticator app</td><td>Yes</td><td>Most accounts</td></tr>
      <tr><td>Text message</td><td>No</td><td>Accounts without a smartphone</td></tr>
      <tr><td>Security key</td><td>Yes</td><td>Administrators and finance users</td></tr>
    </tbody>
  </table>
  <h2>No backup codes?</h2>
  <p>Contact support at (555) 010-0199, Monday to Friday, 8:00 AM to 6:00 PM Eastern. For security, identity checks can take up to two business days.</p>
</textarea>

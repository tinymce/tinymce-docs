<style>
#submitContainer {
  display: flex;
  justify-content: center;
  margin: 1.25rem 0 .75rem;
}
.contentDumpBox {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
  padding: .75rem;
  background: var(--code-background, #f9f9fb);
  border: 1px solid var(--panel-border-color, #c6ccdc);
  border-radius: .25em;
  color: var(--code-font-color, #17224f);
  font-family: "Fira Code", "Roboto Mono", monospace;
  font-size: .8rem;
  line-height: 1.5;
}
.live_demo {
  display: inline-flex;
  align-items: center;
  height: 2.5rem;
  margin: 0;
  padding: 0 1.5rem;
  background: var(--color-tiny-secondary-four, #17224f);
  border: 1px solid var(--color-tiny-secondary-four, #17224f);
  border-radius: .2rem;
  color: #ffffff;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  line-height: 1;
}
.live_demo:hover {
  background: var(--color-tiny-primary-four, #335dff);
  border-color: var(--color-tiny-primary-four, #335dff);
}
.live_demo:focus-visible {
  outline: 2px solid var(--color-tiny-primary-four, #335dff);
  outline-offset: 2px;
}
</style>

<textarea id="default-editor">
  <p><em>Hello</em>, <span style="text-decoration: underline;"><strong>World!</strong></span></p>
</textarea>
<div id="submitContainer">
  <button id="fake-submit" class="live_demo">View HTML Output</button>
</div>
<pre id="output-content" class="contentDumpBox">Click the "View HTML Output" button to see the generated HTML content.</pre>
<script>
  const btn = document.getElementById('fake-submit');
  btn.addEventListener('click', () => {
    const editorContent = tinymce.get('default-editor').getContent();
    const outputElement = document.getElementById('output-content');
    outputElement.innerText = editorContent;
  });
</script>

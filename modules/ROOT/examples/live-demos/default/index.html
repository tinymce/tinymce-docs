  <h1>About Ridgeline Coffee Roasters</h1>
  <p>Small-batch coffee, roasted every weekday in Asheville, North Carolina.</p>
  <h2>Our story</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/aluminium-antique-coffee-6255_thumb.jpg" alt="A stovetop moka pot on a gas burner in front of a weathered wooden wall" width="220" height="147">Maria and Tom Alvarez started Ridgeline in 2016 with a secondhand 5-pound roaster in their garage. Today a team of nine roasts about 1,200 pounds of coffee a week for cafes, offices, and home brewers across western North Carolina.</p>
  <p>We buy green coffee directly from four farms in Colombia, Guatemala, and Ethiopia, and we pay at least 25% above the Fair Trade minimum price. Every bag shows the farm, the harvest month, and the roast date.</p>

  <p>The tasting room at 41 Depot Street is open Tuesday to Saturday, 8 AM to 3 PM. Free public cuppings start at 10 AM every Saturday.</p>

  <h1>Stovetop moka pot coffee</h1>
  <p><em>Serves 2 &middot; Prep 5 minutes &middot; Cook 5 minutes</em></p>
  <p>A moka pot pushes hot water up through finely ground coffee, giving a strong, rich cup that sits somewhere between drip coffee and espresso. It is the coffee served every morning at the lodge café, and it needs nothing more than a stovetop.</p>
  <h2>Ingredients</h2>
  <ul>
    <li>2 tablespoons (about 15 g) finely ground coffee</li>
    <li>1 cup (about 200 ml) cold water</li>
    <li>Warm milk or sugar, to serve (optional)</li>
  </ul>
  <h2>Equipment</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 39.4%;"><col style="width: 60.6%;"></colgroup>
    <thead>
      <tr><th>Item</th><th>Notes</th></tr>
    </thead>
    <tbody>
      <tr><td>Moka pot, 3-cup size</td><td>Aluminum or stainless steel</td></tr>
      <tr><td>Burr grinder</td><td>Set slightly coarser than espresso</td></tr>
      <tr><td>Small saucepan</td><td>Only needed for warming milk</td></tr>
    </tbody>
  </table>
  <h2>Method</h2>
  <ol>
    <li>Fill the bottom chamber with cold water up to the safety valve.</li>
    <li>Fill the filter basket with coffee and level it without pressing it down.</li>
    <li>Screw the top on firmly and set the pot over medium-low heat with the lid open.</li>
    <li>When the coffee starts to sputter and turns pale, take the pot off the heat and pour at once.</li>
  </ol>
  <h2>Tips</h2>
  <ul>
    <li>Start with hot water in the bottom chamber to shorten the brew and avoid a bitter taste.</li>
    <li>Rinse the pot with water only. Soap strips the seasoning from aluminum pots.</li>
  </ul>
  <p>Recipe tested in the Tiny Lodge café kitchen on November 12.</p>
</textarea>

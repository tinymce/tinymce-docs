  <h1>Casa Cala Serena: spring getaways on the Mallorca coast</h1>
  <p>Five nights in a private villa above a quiet swimming cove, with flights from New York, airport transfers and a welcome dinner included. Departures run every Saturday from April 4 to June 13.</p>
  <h2>The cove</h2>
  <p><img src="https://tiny.ucarecdn.com/ab5fa504-67d7-4905-ac98-537ef63006f4/-/resize/1200x/-/brightness/-25/" alt="Turquoise cove with a white boathouse with green doors below wooded cliffs" width="640" height="224"></p>
  <p>A cliff path leads down from the garden gate to the cove in about five minutes. The water stays shallow for the first 30 feet, so the beach suits families with young children.</p>
  <h2>The villa</h2>
  <p><img style="float: right;" src="https://tiny.ucarecdn.com/6e215038-158f-48d1-a94d-d1a74f4f6275/-/resize/600x/" alt="Covered wooden terrace with lounge chairs beside an infinity pool facing the sea at sunset" width="280" height="157">Casa Cala Serena sleeps eight in four bedrooms, each with its own bathroom. The covered terrace runs the full width of the house and looks straight out to sea, with an infinity pool at its edge. All four bedrooms open onto a shaded courtyard, and the two upstairs suites have their own balconies.</p>
  <p>The open-plan kitchen has an island with seating for four, a full-size dishwasher and glass doors that slide back onto the pool deck. A local chef can cook dinner at the villa on request.</p>
  <p><img style="display: block; margin-left: auto; margin-right: auto;" src="https://tiny.ucarecdn.com/f5cf612d-98a4-4159-a153-ae0aa7bb74a5/-/resize/600x/-/rotate/90/" alt="Open-plan kitchen with a wooden island, three woven pendant lights and glass doors open to the pool" width="160" height="286"></p>

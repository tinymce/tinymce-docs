  <h1>Q3 2026 quarterly report</h1>
  <p><strong>Harborline Logistics</strong> | Prepared by the Finance team for the board meeting on 22 October 2026</p>
  <p>Revenue grew 14.9% year on year to $21.15 million, and operating margin improved from 12.0% to 14.4%. Growth came mainly from the new cold-chain contracts in Europe and higher volumes on the trans-Pacific lanes.</p>

  <h2>Highlights</h2>
  <ul>
    <li><strong>Three new cold-chain contracts</strong> signed in the Netherlands and Germany, worth $4.2 million a year.</li>
    <li><strong>On-time delivery</strong> rose to 97.3%, up from 95.8% in Q2.</li>
    <li><strong>Fleet electrification</strong> reached 31% of the urban delivery fleet.</li>
  </ul>

  <h2>Appendix: definitions</h2>
  <p><strong>Gross profit</strong> is revenue minus the direct cost of moving and storing goods, including fuel, carrier fees and warehouse labor.</p>
  <p><strong>Operating profit</strong> is gross profit minus sales, general and administrative expenses. It excludes interest and tax.</p>
  <p><strong>On-time delivery</strong> is the share of shipments delivered within the window agreed with the customer.</p>

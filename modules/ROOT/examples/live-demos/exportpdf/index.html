  <h1>Design proposal: Cedar Hollow Trailhead Pavilion</h1>
  <p><strong>Prepared for:</strong> Pine Ridge County Parks and Recreation<br><strong>Prepared by:</strong> Hollis &amp; Grant Architects<br><strong>Date:</strong> December 4, 2026</p>
  <h2>Project summary</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/countryside-dawn-daylight-1009355_thumb.jpg" alt="A wooden boardwalk leading through a pine forest at dawn" width="240" height="141">The county plans to replace the temporary kiosk at the Cedar Hollow trailhead with a permanent pavilion for hikers, school groups and park rangers. The building sits at the start of the existing boardwalk, so visitors pass through it on the way to the trails.</p>
  <p>This proposal describes a single-story timber pavilion of 2,950 square feet, built from locally milled cedar and designed to be heated only in the occupied rooms.</p>
  <h2>Design approach</h2>
  <ul>
    <li><strong>Low impact:</strong> the pavilion stands on helical piles, so no tree within 20 feet of the footprint is removed.</li>
    <li><strong>Open in all seasons:</strong> the covered breezeway stays open year-round, and the heated rooms close off from it in winter.</li>
    <li><strong>Accessible:</strong> step-free routes link the parking lot, the restrooms and the boardwalk.</li>
  </ul>

  <h2>Appendix: site constraints</h2>
  <p>The building footprint lies outside the 100-year floodplain of Cedar Creek. The soil survey from October 2026 found sandy loam over glacial till, which suits helical piles.</p>
  <p>The parking lot keeps its current 42 spaces, including 4 accessible spaces next to the pavilion entrance.</p>

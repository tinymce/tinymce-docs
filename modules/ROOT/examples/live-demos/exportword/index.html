  <h2>2. Scope of work</h2>
  <p>The Supplier will move the Client's public website from its current content management system to the new platform selected in the 2026 technology review. The work covers:</p>
  <ol>
    <li>An audit of the existing 1,240 pages, with a recommendation to keep, merge or retire each page.</li>
    <li>A design system and page templates that meet WCAG 2.2 level AA.
      <ul>
        <li>Templates for clinic locations, practitioner profiles, services and news.</li>
        <li>Accessible forms for appointment requests and feedback.</li>
      </ul>
    </li>
    <li>Migration of all pages marked <em>keep</em> or <em>merge</em>, including images and downloadable documents.</li>
    <li>Two weeks of support after launch.</li>
  </ol>
  <p>Hosting, domain registration and third-party license fees are <strong>out of scope</strong>.</p>

  <p><strong>FOR RELEASE:</strong> Tuesday, January 12, 2027, 9:00 AM Eastern</p>
  <h1>Ridgeline Cycles introduces the Summit 2, a lighter trail bike built in Colorado</h1>
  <p><em>The new frame weighs 3.1 pounds and ships with a lifetime warranty</em></p>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/adventure-bicycle-bike-161172_thumb.jpg" alt="A cyclist with a mountain bike standing on a grassy hilltop above a wide green valley" width="200" height="133"><strong>BOULDER, Colo., January 12, 2027</strong> — Ridgeline Cycles today introduced the Summit 2, a full-suspension trail bike with a carbon frame that is 14% lighter than the original Summit. Every frame is laid up, painted and tested at the company's Boulder workshop.</p>
  <p>"Riders told us they wanted a bike that climbs like a cross-country racer and still feels calm on rough descents," said Maria Okafor, chief executive officer of Ridgeline Cycles. "The Summit 2 does both, and we stand behind every frame for life."</p>
  <h2>Key features</h2>
  <ul>
    <li>Carbon frame weighing 3.1 pounds in size medium</li>
    <li>140 mm of rear travel with a 150 mm fork</li>
    <li>Internal frame storage for a tube, a pump and tools</li>
    <li>Lifetime frame warranty for the original owner</li>
  </ul>
  <h2>Pricing and availability</h2>
  <p>The Summit 2 is available to order today from ridgelinecycles.example and from 120 dealers in the United States and Canada. Deliveries begin on February 15.</p>

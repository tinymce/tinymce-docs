  <h1>Hybrid work policy review</h1>
  <p>This review summarizes how the hybrid work policy has performed since it was introduced in January, and recommends three changes for the next financial year.</p>
  <h2>Findings</h2>
  <p>Most teams now work from the office two days a week.<sup id="footnote_1801001" class="mce-footnote"><a href="#footnotes_entry_1801001">1</a></sup> Meeting room bookings rose on Tuesdays and Wednesdays, while desk use on Mondays and Fridays stayed below a third of capacity.<sup id="footnote_1801002" class="mce-footnote"><a href="#footnotes_entry_1801002">2</a></sup></p>
  <table>
    <caption>Average desks in use by day (capacity: 240 desks)</caption>
    <thead>
      <tr><th>Day</th><th>Desks in use</th><th>Share of capacity</th></tr>
    </thead>
    <tbody>
      <tr><td>Monday</td><td>70</td><td>29%</td></tr>
      <tr><td>Tuesday</td><td>196</td><td>82%</td></tr>
      <tr><td>Wednesday</td><td>204</td><td>85%</td></tr>
      <tr><td>Thursday</td><td>132</td><td>55%</td></tr>
      <tr><td>Friday</td><td>48<sup id="footnote_1801003" class="mce-footnote"><a href="#footnotes_entry_1801003">3</a></sup></td><td>20%</td></tr>
    </tbody>
  </table>
  <p>Staff rated focus time as the main benefit of working from home, and in-person planning sessions as the main benefit of office days.<sup id="footnote_1801004" class="mce-footnote"><a href="#footnotes_entry_1801004">4</a></sup></p>
  <h2>Recommendations</h2>
  <ol>
    <li>Keep Tuesday and Wednesday as shared office days.</li>
    <li>Release unused Monday and Friday desks to the hot-desking pool.<sup id="footnote_1801005" class="mce-footnote"><a href="#footnotes_entry_1801005">5</a></sup></li>
    <li>Review the policy again in twelve months.</li>
  </ol>

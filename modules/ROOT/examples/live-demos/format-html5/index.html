  <h1>Staff picks for December</h1>
  <p>Every month, booksellers at Lantern Street Books choose the titles they cannot stop recommending. Find these books on the staff picks table by the front window.</p>
  <section>
    <h2>Fiction</h2>
    <article>
      <h3>The Lighthouse Ledger by Nora Vance</h3>
      <p>A keeper's logbook turns up in a junk shop, and a retired schoolteacher sets out to find the families named in its pages. Quiet, funny, and impossible to put down.</p>
      <p>Picked by Dev, fiction buyer. Paperback, $18.99.</p>
    </article>
    <article>
      <h3>Salt and Ember by Isaac Moreno</h3>
      <p>Two rival bakers share one oven during a winter blackout. The best food writing in a novel this year.</p>
      <p>Picked by Hannah, events coordinator. Hardcover, $27.00.</p>
    </article>
  </section>
  <section>
    <h2>Nonfiction</h2>
    <article>
      <h3>Running With the Pack by Lise Arnesen</h3>
      <p>A musher's account of training a sled team for a 1,000-mile race across Alaska, told one dog at a time.</p>
      <figure>
        <img src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-husky.jpg" alt="Gray and white husky with amber eyes standing in a grassy field at dusk" width="200" height="200">
        <figcaption>Juniper, the lead dog on the cover, appears in nine chapters.</figcaption>
      </figure>
      <p>Picked by Marcus, store manager. Hardcover, $29.95.</p>
    </article>
  </section>
  <h2>Young readers</h2>
  <h3>The Moon Library by Priya Shah</h3>
  <p>A girl discovers a library that only opens during a full moon. Ages 8 to 12.</p>
  <p>Picked by Rosa, children's section. Paperback, $9.99.</p>

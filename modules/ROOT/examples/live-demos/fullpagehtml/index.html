<h1>Remote work policy</h1>
<p>Version 3.1, effective 1 January 2027. Owner: People Operations.</p>
<h2>Who can work remotely</h2>
<p>Employees who have completed their probation period can work remotely for up to three days a week, with their manager's agreement. Roles that need on-site equipment, such as field engineering, are excluded.</p>
<h2>How to request remote work</h2>
<ol>
<li>Agree a schedule with the line manager.</li>
<li>Submit the remote work form in the HR portal.</li>
<li>Complete the home workspace safety checklist within two weeks.</li>
</ol>
<h2>Equipment</h2>
<p>The company provides a laptop, a monitor and a headset. Employees can claim up to $300 every two years for a desk or chair.</p>

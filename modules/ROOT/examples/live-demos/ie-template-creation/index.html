<section class="cover">

  <main class="editable">
    <h1>Vendor agreement</h1>
    <p>*{vendor.givenname}* *{vendor.familyname}*</p>

  <footer>

</section>
<section>
  <main class="editable">
    <h1>Welcome to the market</h1>
    <p>Thank you for applying to sell at Riverside Farmers Market. This agreement confirms a weekly stall for *{vendor.business}* from *{season.opening}* until the last market day in October.</p>
    <p>Each stall includes:</p>
    <ul>
      <li>A 10-by-10-foot space on the paved plaza</li>
      <li>Access to shared electrical outlets and handwashing stations</li>
      <li>A listing on the market website and printed map</li>
    </ul>
    <p>Stall fee: $35 per market day, invoiced monthly.</p>
    <p>Application received: *{application.date}*</p>
  </main>
</section>
<section>
  <main class="editable">
    <h1>Market day rules</h1>
    <h2>Setup</h2>
    <p>Vendors arrive between 6:30 AM and 7:30 AM. Vehicles must leave the plaza by 7:45 AM, before the market opens at 8 AM.</p>
    <h2>During market hours</h2>
    <ul>
      <li>Display prices clearly on every product.</li>
      <li>Sell only products grown, raised, or made by *{vendor.business}*.</li>
      <li>Keep tent weights of at least 25 pounds on each leg.</li>
    </ul>
    <h2>Pack-down</h2>
    <p>The market closes at 1 PM. Leave the stall clean and take all waste with you.</p>
  </main>
</section>

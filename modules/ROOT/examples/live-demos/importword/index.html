  <h1>Ten days without a signal: paddling the Northwoods lakes</h1>
  <p><em>Story by Hannah Brooks. Feature for the March issue of Trail &amp; Water magazine, pages 42 to 49.</em></p>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/boat-daylight-lake-675764_thumb.jpg" alt="View from the bow of a wooden rowboat across a still mountain lake toward sunlit rocky peaks" width="220" height="147">On the third morning the lake was so still that the canoe seemed to hang in the air. Hannah Brooks and two friends spent ten days crossing 14 lakes in the Northwoods, carrying everything they needed between them and sleeping at a different campsite each night.</p>
  <p>This feature follows the route from the put-in at Gull Lake to the takeout at Pine Narrows, and asks what changes when there is no way to check a phone for a week and a half.</p>

  <h1 style="line-height: 1.15;">Preparing for your MRI scan</h1>
  <p>This handout explains what happens before, during, and after a magnetic resonance imaging (MRI) scan. The same information is printed twice: once in standard print, and once with wider line spacing for easier reading.</p>
  <h2>Standard print</h2>
  <p style="line-height: 1.3;">Do not eat for four hours before the scan. Water is fine. Remove all jewelry, watches, and hair clips before entering the scanner room, because the scanner uses a strong magnet. The scan takes between 20 and 40 minutes. The machine is loud, so headphones are provided.</p>
  <h2>Easy-to-read print</h2>
  <p style="line-height: 2;">Do not eat for four hours before the scan. Water is fine.</p>
  <p style="line-height: 2;">Take off all jewelry, watches, and hair clips before the scan.</p>
  <p style="line-height: 2;">The scan takes 20 to 40 minutes. The machine is loud, so headphones are provided.</p>
  <h2>What to bring</h2>
  <ul>
    <li style="line-height: 1.8;">The appointment letter</li>
    <li style="line-height: 1.8;">A list of current medications</li>
    <li style="line-height: 1.8;">Glasses, if needed for reading forms</li>
  </ul>

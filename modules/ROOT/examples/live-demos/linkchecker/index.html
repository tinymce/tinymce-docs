  <h1>Preparing for an accessibility review</h1>
  <p>This article collects the references the web team uses before each accessibility review. Check that every link still works before sharing the article with a new team member.</p>
  <h2>Standards</h2>
  <ul>
    <li><a href="https://www.w3.org/WAI/standards-guidelines/wcag/">WCAG overview</a> explains the Web Content Accessibility Guidelines and how the versions relate.</li>
    <li><a href="https://www.w3.org/WAI/WCAG22/quickref/">How to Meet WCAG (Quick Reference)</a> lists every success criterion with techniques.</li>
    <li><a href="https://www.w3.org/WAI/older-guidance/checklist-2009.html">Legacy checklist</a> from the team's first review.</li>
  </ul>
  <h2>Testing tools</h2>
  <ul>
    <li><a href="https://webaim.org/resources/contrastchecker/">WebAIM contrast checker</a> for text and background colors.</li>
    <li><a href="https://www.section508.gov/test/">Section 508 testing guidance</a> for manual test procedures.</li>
    <li><a href="https://developer.mozilla.org/en-US/docs/Web/Accessibility/Screen_reader_checklist">Screen reader checklist</a> for testing with screen readers.</li>
  </ul>
  <h2>Other references</h2>
  <ul>
    <li><a href="https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA">ARIA reference</a> for roles, states and properties.</li>
    <li><a href="https://wiki.intranet.invalid/accessibility/review-template">Review template</a> on the team wiki.</li>
    <li>Questions: <a href="mailto:web-team@example.com">web-team@example.com</a></li>
  </ul>

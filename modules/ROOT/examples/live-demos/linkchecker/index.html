  <h1>Hokusai: Views of Mount Fuji</h1>
  <p><strong>Exhibit guide, Harbor City Museum of Art, East Wing, Galleries 4 to 6.</strong> Open October 3 to February 28, Tuesday to Sunday, 10 AM to 5 PM.</p>
  <p>This exhibit brings together 46 woodblock prints by <a href="https://en.wikipedia.org/wiki/Hokusai">Katsushika Hokusai</a>, including the complete series <a href="https://en.wikipedia.org/wiki/Thirty-six_Views_of_Mount_Fuji">Thirty-six Views of Mount Fuji</a> and its most famous print, <a href="https://en.wikipedia.org/wiki/The_Great_Wave_off_Kanagawa">The Great Wave off Kanagawa</a>.</p>

  <h2>Before your visit</h2>
  <ul>
    <li>Download the free <a href="https://www.harborcitymuseum.invalid/visit/audio-guide">audio guide</a>, narrated by the exhibit curators.</li>
    <li>Order the <a href="https://en.wikipedia.org/wiki/Hokusai_(exhibition_catalog)">exhibit catalog</a>, 240 pages with every print in color.</li>
    <li>Book a guided tour for groups of 10 or more through the <a href="https://tours.harborcitymuseum.invalid/hokusai">tours office</a>.</li>
  </ul>
  <h2>Further reading</h2>
  <ul>
    <li><a href="https://en.wikipedia.org/wiki/Ukiyo-e">Ukiyo-e</a>, the "pictures of the floating world" tradition that Hokusai worked in.</li>
    <li><a href="https://en.wikipedia.org/wiki/Woodblock_printing_in_Japan">Woodblock printing in Japan</a>, from carving the blocks to printing in color.</li>

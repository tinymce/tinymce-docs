<textarea id="markdown">
  <h1>Atlas CLI changelog</h1>
  <p>All notable changes to Atlas CLI are listed here, newest first. Atlas follows <a href="https://semver.org/">semantic versioning</a>.</p>
  <h2>3.2.0</h2>
  <p>Released <strong>November 18, 2026</strong>. This release adds incremental sync and a new <code>doctor</code> command, and removes support for configuration files in the 1.x format.</p>
  <h3>New features</h3>
  <ul>
    <li><strong>Incremental sync:</strong> <code>atlas sync</code> now uploads only the files that changed since the last run.
      <ul>
        <li>Large projects sync up to 8 times faster.</li>
        <li>Use <code>--full</code> to force a complete upload.</li>
      </ul>
    </li>
    <li><strong>Health checks:</strong> <code>atlas doctor</code> checks credentials, network access and the local cache, and suggests a fix for each problem it finds.</li>
  </ul>
  <h3>Upgrading</h3>
  <ol>
    <li>Back up the <code>.atlas</code> folder in the project root.</li>
    <li>Install the new version and run the migration:
      <pre class="language-bash"><code>npm install --global atlas-cli@3.2.0
atlas config migrate</code></pre>
    </li>
    <li>Run <code>atlas doctor</code> to confirm that the project is ready.</li>
  </ol>
  <h3>Breaking changes</h3>
  <p>Configuration files in the 1.x format are no longer read. Run <code>atlas config migrate</code> before upgrading, or see the <a href="https://www.example.com/">migration guide</a>.</p>
  <h2>3.1.4</h2>
  <p>Released <strong>October 2, 2026</strong>.</p>
  <ul>
    <li>Fixed a crash in <code>atlas login</code> when the system proxy required authentication.</li>
    <li>Progress bars now respect the <code>NO_COLOR</code> environment variable.</li>
  </ul>
  <hr>
  <p><em>Thanks to everyone who reported issues during the 3.2 beta.</em></p>
</textarea>

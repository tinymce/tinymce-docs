  <h1>Atlas CLI 3.2 release notes</h1>
  <p>Atlas 3.2 adds incremental sync and a new <code>doctor</code> command, and removes support for configuration files in the 1.x format. Released <strong>18 November 2026</strong>.</p>
  <h2>New features</h2>
  <ul>
    <li><strong>Incremental sync:</strong> <code>atlas sync</code> now uploads only the files that changed since the last run.
      <ul>
        <li>Large projects sync up to 8 times faster.</li>
        <li>Use <code>--full</code> to force a complete upload.</li>
      </ul>
    </li>
    <li><strong>Health checks:</strong> <code>atlas doctor</code> checks credentials, network access and the local cache, and suggests a fix for each problem it finds.</li>
  </ul>
  <h2>Upgrading</h2>
  <ol>
    <li>Back up the <code>.atlas</code> folder in the project root.</li>
    <li>Install the new version and run the migration:
      <pre class="language-bash"><code>npm install --global atlas-cli@3.2.0
atlas config migrate</code></pre>
    </li>
    <li>Run <code>atlas doctor</code> to confirm that the project is ready.</li>
  </ol>
  <h2>Breaking changes</h2>
  <p>Configuration files in the 1.x format are no longer read. Run <code>atlas config migrate</code> before upgrading, or see the <a href="https://example.com/">migration guide</a>.</p>
  <hr>
  <p><em>Thanks to everyone who reported issues during the beta.</em></p>

  <h1>Lab report: the range of a projectile</h1>
  <p>Physics 121, section 3, lab group 4. Submitted March 9, 2027.</p>
  <h2>Aim</h2>
  <p>To test whether a ball launched with speed <tiny-math-inline formula="v_0"></tiny-math-inline> at an angle <tiny-math-inline formula="\theta"></tiny-math-inline> above the horizontal travels the distance predicted by the projectile motion equations, when air resistance is ignored.</p>
  <h2>Theory</h2>
  <p>The ball moves under a constant downward acceleration <tiny-math-inline formula="g \approx 9.81\ \text{m/s}^2"></tiny-math-inline>. The horizontal velocity stays constant, so the position at time <tiny-math-inline formula="t"></tiny-math-inline> is:</p>
  <tiny-math-block formula="\begin{aligned} x(t) &amp;amp;= v_0 \cos\theta \, t \\ y(t) &amp;amp;= v_0 \sin\theta \, t - \tfrac{1}{2} g t^2 \end{aligned}"></tiny-math-block>
  <p>Setting <tiny-math-inline formula="y(t) = 0"></tiny-math-inline> gives the time of flight, and substituting it into <tiny-math-inline formula="x(t)"></tiny-math-inline> gives the range:</p>
  <tiny-math-block formula="T = \dfrac{2 v_0 \sin\theta}{g} \qquad R = \dfrac{v_0^2 \sin 2\theta}{g}"></tiny-math-block>
  <p>At the highest point the vertical velocity is zero, so the maximum height is:</p>
  <tiny-math-block><math display="block"><mi>H</mi><mo>=</mo><mfrac><mrow><msubsup><mi>v</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>sin</mi><mn>2</mn></msup><mi>θ</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math></tiny-math-block>
  <p>The speed of the ball at height <tiny-math-inline formula="h"></tiny-math-inline> follows from conservation of energy:</p>
  <h2>Method</h2>
  <ol>
    <li>Clamp the spring launcher to the bench so that the ball leaves it at floor height.</li>
    <li>Measure the launch speed with a photogate. Our mean value was <tiny-math-inline formula="v_0 = 4.20\ \text{m/s}"></tiny-math-inline>.</li>
    <li>Fire five shots at each of 30°, 45° and 60°, and mark where the ball lands on carbon paper.</li>
    <li>Measure each landing mark from the launch point and record the mean range.</li>
  </ol>
  <h2>Results</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 15.4%;"><col style="width: 29.1%;"><col style="width: 21.4%;"><col style="width: 20.5%;"><col style="width: 13.6%;"></colgroup>
    <thead>
      <tr>
        <th>Launch angle</th>
        <th>Predicted time of flight (s)</th>
        <th>Predicted range (m)</th>
        <th>Measured range (m)</th>
        <th>Difference</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>30°</td>
        <td>0.428</td>
        <td>1.557</td>
        <td>1.52</td>
        <td>−2.4%</td>
      </tr>
      <tr>
        <td>45°</td>
        <td>0.606</td>
        <td>1.798</td>
        <td>1.75</td>
        <td>−2.7%</td>
      </tr>
      <tr>
        <td>60°</td>
        <td>0.742</td>
        <td>1.557</td>
        <td>1.54</td>
        <td>−1.1%</td>
      </tr>
    </tbody>
  </table>
  <h2>Discussion</h2>
  <p>The range was greatest at 45°, and the complementary angles 30° and 60° gave almost the same range, as the theory predicts. Every measured range was slightly short of the prediction. A likely cause is air resistance, which adds a drag force proportional to velocity, where <tiny-math-inline formula="m"></tiny-math-inline> is the mass of the ball and <tiny-math-inline formula="k"></tiny-math-inline> is the drag coefficient:</p>
  <tiny-math-block formula="m \dfrac{d^2 \vec{r}}{dt^2} = -m g \, \hat{\jmath} - k \dfrac{d \vec{r}}{dt}"></tiny-math-block>
  <h2>Conclusion</h2>
  <p>The measured ranges agree with the drag-free model to within 3%, which is close enough for launch speeds below 5 m/s.</p>

<textarea id="math_demo">
  <blockquote>
    <p><strong>Try it:</strong></p>
    <ul>
      <li>Click any equation and select <strong>Insert/edit math</strong> in the toolbar to open its LaTeX source, edit it and watch the <strong>Preview</strong> update.</li>
      <li>Open the maximum height equation the same way. It was written in MathML instead of LaTeX, and the <strong>Language</strong> list shows which one each equation uses.</li>
      <li>Place the cursor at the end of a paragraph, select <strong>Insert/edit math</strong>, enter <code>v = \sqrt{v_0^2 - 2gh}</code> and set <strong>Text Wrap</strong> to <strong>Inline with text</strong> or <strong>Text above and below</strong>.</li>
    </ul>
  </blockquote>
  <h1>Projectile motion</h1>
  <p>A projectile launched with speed <tiny-math-inline formula="v_0"></tiny-math-inline> at an angle <tiny-math-inline formula="\theta"></tiny-math-inline> above the horizontal moves under a constant downward acceleration <tiny-math-inline formula="g \approx 9.81\ \text{m/s}^2"></tiny-math-inline>. Ignoring air resistance, the horizontal and vertical motion can be treated separately.</p>
  <h2>Equations of motion</h2>
  <p>The horizontal velocity stays constant while the vertical velocity changes at the rate <tiny-math-inline formula="-g"></tiny-math-inline>, so the position at time <tiny-math-inline formula="t"></tiny-math-inline> is:</p>
  <tiny-math-block formula="\begin{aligned} x(t) &amp;amp;= v_0 \cos\theta \, t \\ y(t) &amp;amp;= v_0 \sin\theta \, t - \tfrac{1}{2} g t^2 \end{aligned}"></tiny-math-block>
  <h2>Time of flight and range</h2>
  <p>Setting <tiny-math-inline formula="y(t) = 0"></tiny-math-inline> and solving for <tiny-math-inline formula="t &amp;gt; 0"></tiny-math-inline> gives the time of flight:</p>
  <tiny-math-block formula="T = \frac{2 v_0 \sin\theta}{g}"></tiny-math-block>
  <p>Substituting <tiny-math-inline formula="T"></tiny-math-inline> into <tiny-math-inline formula="x(t)"></tiny-math-inline> and using the identity <tiny-math-inline formula="2 \sin\theta \cos\theta = \sin 2\theta"></tiny-math-inline> gives the horizontal range:</p>
  <tiny-math-block formula="R = \frac{v_0^2 \sin 2\theta}{g}"></tiny-math-block>
  <p>The range is greatest at 45°, and complementary angles such as 30° and 60° give the same range.</p>
  <h2>Maximum height</h2>
  <p>At the highest point the vertical velocity is zero, so the maximum height is:</p>
  <tiny-math-block><math display="block"><mi>H</mi><mo>=</mo><mfrac><mrow><msubsup><mi>v</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>sin</mi><mn>2</mn></msup><mi>θ</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math></tiny-math-block>
  <h2>Trajectory</h2>
  <p>Eliminating <tiny-math-inline formula="t"></tiny-math-inline> from the equations of motion shows that the path is a parabola:</p>
  <tiny-math-block formula="y = x \tan\theta - \frac{g x^2}{2 v_0^2 \cos^2\theta}"></tiny-math-block>
  <h2>Worked example</h2>

  <h2>Adding air resistance</h2>
  <p>With a drag force proportional to velocity, where <tiny-math-inline formula="m"></tiny-math-inline> is the mass and <tiny-math-inline formula="k"></tiny-math-inline> is the drag coefficient, the motion follows a vector differential equation:</p>
  <tiny-math-block formula="m \frac{d^2 \vec{r}}{dt^2} = -m g \, \hat{\jmath} - k \frac{d \vec{r}}{dt}"></tiny-math-block>
  <p>Solving each component shows that the horizontal velocity decays exponentially and the vertical velocity approaches the terminal value <tiny-math-inline formula="-mg/k"></tiny-math-inline>:</p>
  <tiny-math-block formula="\begin{cases} x(t) = \dfrac{m v_0 \cos\theta}{k} \left(1 - e^{-kt/m}\right) \\[6pt] y(t) = \dfrac{m}{k} \left(v_0 \sin\theta + \dfrac{m g}{k}\right) \left(1 - e^{-kt/m}\right) - \dfrac{m g}{k} \, t \end{cases}"></tiny-math-block>
</textarea>

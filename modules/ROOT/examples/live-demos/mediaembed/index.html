  <h1>ANIM 210: Introduction to 3D Animation</h1>
  <p>Spring 2027 syllabus. Tuesdays and Thursdays, 2:00 PM to 3:50 PM, Media Arts Building, room 114.</p>
  <h2>Course overview</h2>
  <p>This course covers the core principles of 3D animation: timing, spacing, posing and camera work. Each week starts with a short open movie from the Blender Foundation. The production files of all three films are free to download, so the practical sessions take shots apart frame by frame.</p>

  <p>Watch each film before the Tuesday class in the same week.</p>

  <p>Focus on character timing and squash and stretch in the opening chase.</p>

  <h3>Week 2: Sintel</h3>
  <p>Note how the camera moves during the rooftop chase, and where the editor cuts between wide and close shots.</p>

  <p>This film mixes live action with visual effects. Look for the shots where the set extensions begin.</p>

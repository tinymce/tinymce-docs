  <h1>Postmortem: checkout API outage on November 18</h1>
  <p><strong>Status:</strong> draft for review. <strong>Severity:</strong> SEV-1. <strong>Duration:</strong> 47 minutes. <strong>Incident commander:</strong> <span class="mymention" data-mention-id="dmitri-sokolov">@Dmitri Sokolov</span></p>
  <h2>Summary</h2>
  <p>From 2:12 PM to 2:59 PM ET, 31% of checkout requests failed with HTTP 503 errors. A routine deployment lowered the database connection pool limit of the checkout service from 200 to 20, and the service ran out of connections as afternoon traffic peaked. No payment data was lost. 4,180 customers saw an error, and 1,260 of them completed their order on a second attempt.</p>

  <h2>Root cause</h2>
  <p>The connection pool limit is set in a configuration file that three services share. A change meant to reduce the load from the reporting service also applied to the checkout service, and the code review did not show which services read the file.</p>
  <h2>What went well</h2>
  <ul>
    <li>Alerts fired 7 minutes after the deployment reached all regions.</li>
    <li>The rollback runbook worked as written and took 11 minutes.</li>
  </ul>

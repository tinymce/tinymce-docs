  <h1>Grandma Rose's buttermilk biscuits</h1>
  <p><em>From the Delgado family recipe archive. Added by Carmen, November 30.</em></p>
  <p>Rose baked these every Sunday morning in her cast-iron skillet. The secret is cold butter and a light hand: fold the dough instead of kneading it.</p>
  <p><strong>Makes:</strong> 10 biscuits &middot; <strong>Prep:</strong> 15 minutes &middot; <strong>Bake:</strong> 14 minutes at 450&deg;F</p>
  <h2>Ingredients</h2>
  <ul>
    <li>2 cups all-purpose flour</li>
    <li>1 tablespoon baking powder</li>
    <li>1 teaspoon salt</li>
    <li>6 tablespoons cold unsalted butter, cubed</li>
    <li>3/4 cup cold buttermilk</li>
  </ul>
  <h2>Method</h2>
  <ol>
    <li>Heat the oven to 450&deg;F and put the skillet inside to warm.</li>
    <li>Whisk the flour, baking powder, and salt. Cut in the butter until the pieces are the size of peas.</li>
    <li>Stir in the buttermilk until just combined. Fold the dough over itself four times.</li>
    <li>Pat the dough 1 inch thick, cut 10 rounds, and bake until golden.</li>
  </ol>
  <p>Carmen's note: Rose brushed the tops with melted butter as soon as they came out of the oven.</p>

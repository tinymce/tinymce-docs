  <h1>Winter break schedule and kindergarten registration</h1>
  <p><em>Cedar Valley School District, December 8</em></p>
  <p>Dear families,</p>
  <p>All Cedar Valley schools close for winter break from Monday, December 22 through Friday, January 2. Classes resume on Monday, January 5. School offices stay open on December 22 and 23 from 8 AM to 2 PM.</p>
  <h2>Kindergarten registration</h2>
  <p>Registration for the next school year opens on January 12. Children who turn five by September 1 are eligible. Bring these documents to your neighborhood school:</p>
  <ul>
    <li>Birth certificate or passport</li>
    <li>Immunization record</li>
    <li>Two proofs of address, such as a utility bill and a lease</li>
  </ul>
  <h2>Family information night</h2>
  <p>Join principals and kindergarten teachers on Thursday, January 8 at 6:30 PM in Room 114 at Cedar Valley Elementary. Childcare is provided in the gym. Parking is available behind Room 114 and in the north lot.</p>

  <h1>Orders API changelog</h1>
  <p>Changes to the Orders REST API, newest first. Each change lists the support ticket that prompted it.</p>
  <h2>Version 3.4.0, December 10, 2026</h2>
  <ul>
    <li>Added the <code>fulfillment_status</code> filter to <code>GET /orders</code>. Ticket 512-884-301.</li>
    <li>Requests that send the <code>apikey</code> query parameter now receive a <code>Deprecation</code> response header. Send the key in the <code>Authorization</code> header instead. Ticket 512-901-447.</li>
  </ul>
  <h2>Version 3.3.2, November 18, 2026</h2>
  <ul>
    <li>Fixed: <code>GET /orders/{id}</code> returned a 500 error for orders with more than 250 line items. Ticket 498-310-275.</li>
    <li>Fixed: rate limit headers were missing from 429 responses. Ticket 498-322-106.</li>
  </ul>

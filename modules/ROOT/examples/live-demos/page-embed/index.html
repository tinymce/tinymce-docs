  <h1>Field trip lesson plan: gravity and orbits</h1>
  <p>Lakeside Science Museum, education team. For grades 6 to 8, groups of up to 30 students. Visit length: 2 hours.</p>
  <h2>Learning goals</h2>
  <p>By the end of the visit, students can:</p>
  <ul>
    <li>Explain why the Moon stays in orbit instead of falling to Earth or flying off into space.</li>
    <li>Describe how the mass of a star and the distance to it change the path of a planet.</li>
    <li>Use a simulation to test a prediction and record the result.</li>
  </ul>
  <h2>Before the visit</h2>
  <p>Spend 20 minutes in class with this simulation. Ask students to turn gravity off and predict what the Earth will do, then turn it back on and make the Sun twice as heavy.</p>

  <h2>Project summary</h2>
  <p>Salt marshes store carbon in their soil far faster than most forests, but little is known about how quickly restored marshes catch up with natural ones. This project measures soil carbon at six restored sites and two natural reference sites along the Bayshore coast over three growing seasons.</p>
  <h2>Research aims</h2>
  <ol>
    <li>Measure the rate of carbon burial at each site, using sediment cores taken every spring.</li>
    <li>Compare the plant species at restored and natural sites, and link species mix to carbon storage.</li>
    <li>Publish a free field guide that restoration teams can use to estimate carbon gains.</li>
  </ol>

  <h1>Riverside Press editorial style guide</h1>
  <p>Draft 3, prepared by the copy desk for review by the section editors. Comments are due by Friday, January 15.</p>
  <h2>Voice and tone</h2>
  <p>Write for a curious reader who is not an expert. Prefer short sentences and plain words, and explain any technical term the first time it appears.</p>
  <h2>Numbers</h2>
  <ul>
    <li>Spell out numbers from one to nine, and use figures for 10 and above.</li>
    <li>Always use figures for ages, percentages and money: a 6-year-old, 4%, $5.</li>
    <li>Spell out a number that starts a sentence.</li>
  </ul>
  <p><em><span style="font-family: georgia, palatino, serif; color: #335dff; font-size: 12pt;">[Copy desk: Should "percent" be spelled out in feature stories? The sports desk prefers the symbol.]</span></em></p>
  <h2>Dates and times</h2>
  <p>Write dates as month and day, without the ordinal: December 13, not December 13th. Use AM and PM with a space after the number, such as 7:30 PM, and write noon and midnight instead of 12 PM and 12 AM.</p>
  <h2>Headlines</h2>
  <ol>
    <li>Use sentence case: capitalize only the first word and proper nouns.</li>
    <li>Keep headlines under 70 characters so that they fit on one line in search results.</li>
    <li>Use numerals in headlines, even for numbers under 10.</li>
  </ol>
  <p><em><span style="font-family: georgia, palatino, serif; color: #335dff; font-size: 12pt;">[Copy desk: Point 3 conflicts with the numbers rule above. Confirm with the managing editor.]</span></em></p>

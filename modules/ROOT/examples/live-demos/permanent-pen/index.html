  <h1>Why neighborhood tool libraries are growing</h1>
  <p><em>Feature draft 2 by Jordan Ellis. Editor notes by the features desk.</em></p>
  <p>Three years ago, the Elm Street tool library was a single shelf in a church basement. Today it lends more than 900 tools, from cordless drills to pressure washers, to anyone with a library card. <span style="font-family: arial, helvetica, sans-serif; font-size: 12pt; color: #1a56db; background-color: #e8f0fe;"><strong>[Ed: Add the current opening hours of the Elm Street branch.]</strong></span></p>
  <p>&ldquo;Most people use a drill for about fifteen minutes in its whole life,&rdquo; says volunteer coordinator Ana Ruiz. &ldquo;It makes more sense to share one.&rdquo;</p>
  <h2>A second branch opens</h2>
  <p>Demand grew fast enough that the library opened a second branch on Harbor Road in May. Members borrowed 2,400 items in the first month alone. <span style="font-family: arial, helvetica, sans-serif; font-size: 12pt; color: #1a56db; background-color: #e8f0fe;"><strong>[Ed: Confirm the 2,400 figure with Ana before publication.]</strong></span></p>
  <h2>Repair nights</h2>
  <p>On the first Thursday of each month, volunteers run a repair night where members bring broken lamps, bikes, and toasters to fix together.</p>
  <h2>What comes next</h2>
  <p>The library plans to add gardening tools in the spring and is looking for volunteers with woodworking experience to help maintain the collection.</p>

  <h1>Three slow mornings at The Larkspur</h1>
  <p><em>Posted by Maya Ellison, guest experience manager, on October 14</em></p>
  <p>Fall is the quietest season at The Larkspur, and the best time to start the day slowly. Here is how our guests spend their mornings before the day-trippers arrive.</p>
  <h2>On the lake before 8 AM</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/boat-daylight-lake-675764_thumb.jpg" alt="The bow of a wooden rowboat on a still lake, with sunlit rocky mountains behind" width="220" height="147">The lake is at its calmest just after sunrise. Guests staying in the Lakeview rooms can borrow one of our two wooden rowboats from the dock between 6:30 AM and 10 AM. Life jackets and a thermos of coffee wait in each boat.</p>
  <p>Mist usually clears by 8 AM, so the earliest rowers get the stillest water and the best light on the peaks.</p>
  <h2>Breakfast on the terrace</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/aluminium-antique-coffee-6255_thumb.jpg" alt="A stovetop espresso maker on a gas burner in front of a weathered wooden wall" width="200" height="133">Breakfast is served on the heated terrace from 7 AM to 10:30 AM. The kitchen brews stovetop espresso to order, and this month's menu features produce from Hollis Farm, ten minutes down the valley road:</p>
  <ul>
    <li>Buckwheat pancakes with late-season blueberries</li>
    <li>Smoked trout on rye with pickled shallots</li>
    <li>Overnight oats with honey from our own hives</li>
  </ul>

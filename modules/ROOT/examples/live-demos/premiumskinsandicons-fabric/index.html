    <h1>Ninth Street Fire Station No. 4</h1>
    <p>A two-bay fire station for the City of Millbrook, completed in September on a narrow corner lot. The station replaces a 1962 building on the same site and stays open to the neighborhood as a polling place and storm shelter.</p>

    <h2>Design approach</h2>
    <p>The apparatus bay faces Ninth Street behind a wall of glass doors, so passers-by can see the engines. Living quarters sit on the quieter side street, above a public community room.</p>
    <ul>
      <li>Daylight: clerestory windows along the north wall light the bay without glare on the screens in the watch office.</li>
      <li>Materials: brick salvaged from the 1962 station, cross-laminated timber floors and a standing-seam metal roof.</li>
      <li>Health: a decontamination corridor separates the bay from the living quarters, so crews leave smoke and soot behind.</li>
    </ul>
    <h2>Project team</h2>
    <p>Principal in charge: Dana Whitfield. Project architect: Luis Ortega. Structural engineering by Kessler Engineering.</p>

    <h1>First-year admission: how to apply</h1>
    <p>Applications for students starting in fall 2027 open on August 1. Westbrook reviews every application in full, and no single grade or score decides an outcome.</p>
    <h2>Deadlines</h2>
    <table style="border-collapse: collapse; width: 100%;" border="1">
      <colgroup><col style="width: 39.3%;"><col style="width: 30.4%;"><col style="width: 30.3%;"></colgroup>

      </thead>
      <tbody>
        <tr><td>Early action</td><td>November 1</td><td>December 15</td></tr>
        <tr><td>Early decision</td><td>November 15</td><td>December 20</td></tr>
        <tr><td>Regular decision</td><td>January 15</td><td>March 31</td></tr>
      </tbody>
    </table>
    <h2>What to submit</h2>
    <ul>
      <li>The online application and the $60 application fee, or a fee waiver</li>
      <li>An official high school transcript</li>
      <li>One counselor recommendation and one teacher recommendation</li>
      <li>A personal essay of 650 words or fewer</li>
    </ul>
    <p>Test scores are optional for fall 2027 applicants.</p>
    <h2>Visit campus</h2>
    <p>Student-led tours leave the Welcome Center at 10 AM and 2 PM, Monday to Friday. For questions, call the Office of Admissions at (555) 010-0128.</p>

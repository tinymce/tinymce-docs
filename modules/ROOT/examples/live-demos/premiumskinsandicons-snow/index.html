  <h1>Bike service guide</h1>
  <p>Every bike that comes through the Spoke &amp; Chain workshop gets the same checks, whatever the service level. This guide explains what each service includes and how to prepare a bike for drop-off.</p>
  <p><strong>Service levels</strong></p>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 26%;"><col style="width: 45%;"><col style="width: 10%;"><col style="width: 19%;"></colgroup>
    <thead>
      <tr><th>Service</th><th>Includes</th><th>Price</th><th>Turnaround</th></tr>
    </thead>
    <tbody>
      <tr><td>Safety check</td><td>Brakes, gears and tire pressure adjusted, bolts torqued</td><td>$45</td><td>Same day</td></tr>
      <tr><td>Standard tune-up</td><td>Safety check, plus wheels trued, drivetrain cleaned and lubed</td><td>$95</td><td>2 days</td></tr>
      <tr><td>Full overhaul</td><td>Bike stripped, every bearing serviced, new cables and housing</td><td>$240</td><td>5 days</td></tr>
    </tbody>
  </table>
  <p><strong>Before drop-off</strong></p>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/adventure-bicycle-bike-161172_thumb.jpg" alt="A cyclist in a helmet and backpack standing with a mountain bike on a grassy hilltop above a valley" width="220" height="147">A few minutes of preparation help the mechanics finish on time:</p>
  <ol>
    <li>Remove lights, bags, bottles and bike computers.</li>
    <li>Write down any noises or problems, and when they happen.</li>
    <li>Bring the key for any lock or rack that stays on the bike.</li>
  </ol>
  <h2>Pickup</h2>
  <p>A text message arrives when the bike is ready. The workshop holds finished bikes for 14 days. Opening hours are 9:00 AM to 6:00 PM, Tuesday to Saturday. Call (555) 010-0172 with questions.</p>

  <h1>Alpine Lakes Walking Tour: four-day itinerary</h1>
  <p>This guided tour links three mountain lakes on well-marked trails, with nights in family-run guesthouses. Luggage moves between guesthouses by van, so walkers carry only a day pack.</p>

  <h2>Day 1: arrival and lakeshore loop</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/boat-daylight-lake-675764_thumb.jpg" alt="The bow of a wooden rowboat on a calm lake, facing rocky mountain peaks lit by the sun" width="220" height="147">Meet the guide at the guesthouse at 2 PM for a welcome briefing and gear check. A short loop around the lake follows, with time for photos at the boat dock before dinner at 7 PM.</p>
  <h2>Day 2: forest boardwalk to Larch Lake</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/countryside-dawn-daylight-1009355_thumb.jpg" alt="A narrow wooden boardwalk leading through a pine forest in low morning sun" width="220" height="129">The trail starts on a wooden boardwalk through old pine forest, then climbs gently to Larch Lake. Lunch is a packed picnic at the lake's north shore.</p>
  <h2>Day 3: ridge trail to Silver Lake</h2>
  <p>The longest day crosses an open ridge with views over both valleys. There is no shade after the first mile, so start by 8 AM and carry at least two quarts of water.</p>
  <h2>Day 4: morning row and departure</h2>
  <p>Take a rowboat out on Silver Lake before breakfast. The shuttle to the train station leaves at 11 AM.</p>
  <h2>What to pack</h2>
  <ul>
    <li>Broken-in hiking boots and two pairs of wool socks</li>
    <li>A waterproof jacket and a warm midlayer</li>
    <li>Sunscreen, a hat and a refillable water bottle</li>
  </ul>

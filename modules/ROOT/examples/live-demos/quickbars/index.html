  <h1>Three days on the east coast of Mallorca</h1>
  <p>Most visitors to Mallorca stay close to Palma. Two hours east, the coastline breaks into small coves, fishing villages and pine-covered headlands that are easy to explore without a car.</p>
  <p><img src="https://tiny.ucarecdn.com/ab5fa504-67d7-4905-ac98-537ef63006f4/-/resize/750x/" alt="Turquoise water in a rocky cove, with a white boathouse and small boats on the shore below pine-covered cliffs" width="750" height="263"></p>
  <h2>Day one: coves and boathouses</h2>
  <p>Start early to reach the coves before the tour boats arrive. The coastal path between the villages takes about two hours and passes old boathouses carved into the rock, where fishing families still keep their boats.</p>
  <h2>Day two: a market morning</h2>
  <p>The weekly market fills the old town square from 8 am until noon. Look for almonds, sobrassada and ensaïmada pastries, and bring cash, because few stalls accept cards.</p>
  <h2>Day three: the lighthouse walk</h2>
  <p>The lighthouse trail climbs gently for 6 km to a viewpoint over the open sea. There is no shade after the first kilometer, so carry at least two liters of water and set out before 10 am in summer.</p>
  <p>Plan for around 70 euros a day for meals and buses, and book accommodation early for July and August.</p>

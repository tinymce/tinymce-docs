  <h2>Module 1: Knife skills and kitchen safety</h2>
  <p>On the first day, each student will recieve a chef's knife, a paring knife and a honing steel. Students keep raw meat and vegetables on seperate cutting boards at all times, and check the fridge temperture at the start of every class.</p>
  <h2>Module 2: Stocks, soups and sauces</h2>
  <p>Every sauce starts with good preparation, or as French kitchens say, <span lang="fr">tout comence par la mise en place</span>. Students practice the classic sauces until they can definately make each one without a recipe. Dietary needs are easy to accomodate: each stock has a vegetable version.</p>
  <h2>Module 3: Baking and pastry</h2>
  <p>Students bake bread every week of this module and finish with a laminated pastry, folded and chilled over two days.</p>
  <h2>Module 4: Coffee and plated desserts</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/aluminium-antique-coffee-6255_thumb.jpg" alt="A stovetop moka pot on a gas burner" width="220" height="147">The final module starts with the moka pot, which brews strong coffee on the stove. Our Italian instructor reminds every class: <span lang="it">la moka si riempie d'acqua fino alla valvolla, mai oltre</span>. Students who occassionally overfill it learn why on the first try.</p>
  <h2>What to bring</h2>
  <ul>
    <li>Closed-toe, non-slip shoes</li>
    <li>A notebook for tasting notes</li>
    <li>Hair ties or a cap</li>
  </ul>

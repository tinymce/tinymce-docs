  <h1>Cedar Ridge Trails Conservancy: 2026 annual report</h1>
  <p>Prepared for members, volunteers and funders. Draft for board review, December 2026.</p>
  <h2>A year on the trails</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/countryside-dawn-daylight-1009355_thumb.jpg" alt="A wooden boardwalk trail running through a pine forest in early morning light" width="150" height="88">Volunteers logged 12,400 hours this year, the most in the history of the conservancy. Crews rebuilt 2.4 miles of boardwalk on the Hollow Creek loop, which reopened to hikers on June 14.</p>
  <p>The conservancy also completed its first accessible trail: a 0.6-mile paved path from the Ridge Road parking area to the lake overlook.</p>
  <h2>Program highlights</h2>
  <ul>
    <li>Trail stewardship: 46 work days, 318 volunteers and 9 bridges repaired</li>
    <li>Youth outdoor program: 1,150 students from 14 schools</li>
    <li>Land protection: 85 acres added to the Hollow Creek preserve</li>
    <li>Community events: 22 guided walks and the first Trails Day festival</li>
  </ul>

      </tr>
    </tbody>
  </table>
  <p>Program spending made up 82% of total expenses. The audited financial statements will be posted by March 31.</p>
  <h2>Thank you</h2>
  <p>Every mile of trail in this report was built or cared for by the 1,900 members and 318 volunteers of the conservancy. Questions about this report: (555) 010-0177.</p>

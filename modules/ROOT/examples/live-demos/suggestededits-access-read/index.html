  <h1>Northwind Robotics, Inc.: minutes of the board of directors meeting</h1>
  <p>Tuesday, November 17, 2026, 9:00 AM to 11:30 AM, Conference Room B and video call. Draft for approval at the December 15 meeting.</p>
  <h2>Attendance</h2>
  <ul>
    <li><strong>Present:</strong> Margaret Chen (Chair), Robert Alvarez, Priya Natarajan and Thomas Becker</li>
    <li><strong>Absent:</strong> Linda Okoye</li>
    <li><strong>Also attending:</strong> David Kim, Chief Operating Officer; Elena Rodriguez, Chief Financial Officer; Celeste Henderson, Corporate Secretary</li>
  </ul>
  <h2>1. Call to order</h2>
  <p>The Chair called the meeting to order at 9:04 AM and confirmed that a quorum was present.</p>
  <h2>2. Approval of previous minutes</h2>
  <p>The board approved the minutes of the October 20 meeting without changes.</p>
  <h2>3. Financial report</h2>
  <p>The Chief Financial Officer presented the third-quarter results. Revenue was $18.6 million, up 14% from the same quarter last year, and operating cash flow was positive for the second quarter in a row.</p>

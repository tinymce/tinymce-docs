  <h1>Ledgerline 4.2 release notes</h1>
  <p>Release date: December 9, 2026. This release adds scheduled exports and approval rules, speeds up large ledger imports and fixes 3 issues reported by customers.</p>
  <h2>New features</h2>
  <h3>Scheduled exports</h3>
  <p>Exports can now run on a daily, weekly or monthly schedule and are delivered to an SFTP server or an Amazon S3 bucket.</p>
  <h3>Approval rules for journal entries</h3>
  <p>Administrators can require a second approver for journal entries above a set amount.</p>
  <h2>Improvements</h2>
  <ul>
    <li>Imports of ledgers with more than 100,000 rows are up to 4 times faster.</li>
    <li>Account search now matches partial account numbers.</li>
    <li>Date pickers follow the date format set in the user profile.</li>
  </ul>
  <h2>Bug fixes</h2>
  <ul>
    <li>Fixed an issue where CSV exports used a comma as the decimal separator in some locales.</li>
    <li>Fixed an issue where the trial balance report left out accounts with a zero balance.</li>
    <li>Fixed an issue where a session timeout discarded unsaved journal entries.</li>
  </ul>
  <h2>Upgrade notes</h2>
  <p>Self-hosted installations must upgrade the database to <strong>PostgreSQL 15 or later</strong> before installing this release. Cloud customers do not need to take any action.</p>

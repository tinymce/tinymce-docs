  <h1>Reducing cold-start latency in serverless functions</h1>
  <p>Technical whitepaper, version 0.9 draft. Platform Engineering, December 2026.</p>
  <h2>Abstract</h2>
  <p>Cold starts add between 0.8 and 2.1 seconds to the first request a serverless function handles after a period of inactivity. This paper compares four mitigation techniques across 1,200 production functions and shows that snapshot-based restore cuts the median cold-start time by 62% while adding less than 5% to the monthly compute cost.</p>
  <h2>Background</h2>
  <p>A cold start happens when the platform must create a new execution environment before it can run a function. The environment downloads the deployment package, starts the language runtime and runs the initialization code.</p>
  <h2>Techniques compared</h2>
  <ol>
    <li><strong>Provisioned concurrency</strong>: keeps a fixed number of environments initialized at all times.</li>
    <li><strong>Snapshot-based restore</strong>: saves a memory snapshot after initialization and restores it instead of starting from scratch.</li>
    <li><strong>Dependency trimming</strong>: removes unused libraries from the deployment package to shorten download and load time.</li>
    <li><strong>Lazy initialization</strong>: defers loading optional modules until the first request that needs them.</li>
  </ol>
  <h2>Results</h2>
  <p>Table 1 lists the median cold-start time for each technique, measured on functions with a 512 MB memory setting.</p>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 38.0%;"><col style="width: 31.0%;"><col style="width: 31.0%;"></colgroup>
    <thead>
      <tr>
        <th>Technique</th>
        <th>Cold start</th>
        <th>Extra cost</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>No mitigation</td>
        <td>1,480 ms</td>
        <td>0%</td>
      </tr>
      <tr>
        <td>Provisioned concurrency</td>
        <td>90 ms</td>
        <td>38%</td>
      </tr>
      <tr>
        <td>Snapshot-based restore</td>
        <td>560 ms</td>
        <td>4.6%</td>
      </tr>
      <tr>
        <td>Dependency trimming</td>
        <td>1,210 ms</td>
        <td>0%</td>
      </tr>
      <tr>
        <td>Lazy initialization</td>
        <td>1,140 ms</td>
        <td>0%</td>
      </tr>
    </tbody>
  </table>
  <p>Provisioned concurrency removes almost all cold-start delay, but its cost grows with the number of reserved environments, <strong>whether or not they handle traffic</strong>.</p>
  <h2>Recommendations</h2>
  <p>Use snapshot-based restore as the default for latency-sensitive functions. Reserve provisioned concurrency for functions with steady traffic and a strict latency target, and apply dependency trimming to every function.</p>
  <p>Measure how often each function starts cold before choosing a technique, because functions that run every few seconds rarely start cold. The full benchmark method is in the <a href="https://www.example.com/">benchmark repository</a>.</p>

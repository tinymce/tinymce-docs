  <h1>Customer refund policy</h1>
  <p>Effective date: January 1, 2027. Owner: Customer Success.</p>
  <h2>Eligibility</h2>
  <p>Customers can request a full refund within the refund window for their plan. Refunds are not available for accounts that have used more than half of their monthly usage allowance.</p>
  <table>
    <thead>
      <tr><th>Plan</th><th>Refund window</th></tr>
    </thead>
    <tbody>
      <tr><td>Monthly</td><td>30 days</td></tr>
      <tr><td>Annual</td><td>30 days</td></tr>
      <tr><td>Enterprise</td><td>As agreed in the contract</td></tr>
    </tbody>
  </table>
  <h2>How to request a refund</h2>
  <ol>
    <li>Contact support from the billing page of the account settings.</li>
    <li>Provide the order number and the reason for the request.</li>
    <li>Confirm the request from the link in the confirmation email.</li>
  </ol>
  <h2>Processing times</h2>
  <p>Support reviews each request within two business days. Approved refunds are issued to the original payment method within <strong>10 business days</strong>.</p>
  <h2>Exceptions</h2>
  <p>Refund requests for orders older than 12 months need approval from the Finance team.</p>

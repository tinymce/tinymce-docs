  <h2 id="welcome">Welcome</h2>
  <p>Welcome to Brightwater Family Clinics. This handbook explains how we work together and what each employee can expect from the clinic.</p>
  <h3 id="our-values">Our values</h3>
  <ul>
    <li>Patients first: every decision starts with patient safety.</li>
    <li>Respect: treat colleagues and patients the way they want to be treated.</li>
    <li>Learning: ask questions, share what works and fix what does not.</li>
  </ul>
  <h3 id="using-this-handbook">Using this handbook</h3>
  <p>The People team reviews this handbook every January. If a policy here conflicts with an employment contract, the contract applies.</p>
  <h2 id="hours-and-pay">Hours and pay</h2>
  <h3 id="schedules-and-breaks">Schedules and breaks</h3>
  <p>Clinics open from 7:30 AM to 7:00 PM, Monday to Friday, and from 9:00 AM to 1:00 PM on Saturday. Shifts longer than six hours include an unpaid 30-minute meal break.</p>
  <h3 id="overtime">Overtime</h3>
  <p>Hours worked beyond 40 in a week count as overtime.</p>
  <h4 id="approval">Approval</h4>
  <p>A clinic manager must approve overtime before the shift starts, except in a patient emergency.</p>
  <h4 id="overtime-rates">Overtime rates</h4>
  <p>Overtime is paid at one and a half times the regular hourly rate.</p>
  <h3 id="night-and-weekend-rates">Night and weekend rates</h3>
  <p>Shifts that start after 6:00 PM or on a Saturday earn an extra $3.50 per hour, on top of any overtime rate.</p>
  <h3 id="payday">Payday</h3>
  <p>Pay is deposited every second Friday. Pay stubs are available in the HR portal the day before.</p>
  <h2 id="time-off">Time off</h2>
  <h3 id="vacation">Vacation</h3>
  <p>Full-time employees earn 15 days of paid vacation per year. Request vacation in the HR portal at least two weeks ahead.</p>
  <h3 id="sick-leave">Sick leave</h3>
  <p>Call the clinic manager at least one hour before the shift starts. A doctor's note is needed for absences longer than three days.</p>

  <h2 id="conduct-and-safety">Conduct and safety</h2>
  <h3 id="dress-code">Dress code</h3>
  <p>Clinical staff wear the scrubs supplied by the clinic and closed-toe shoes. Staff ID badges must be visible at all times.</p>
  <h3 id="reporting-a-concern">Reporting a concern</h3>
  <p>Report a safety or conduct concern to a clinic manager, or call the confidential People team line at (555) 010-0199.</p>

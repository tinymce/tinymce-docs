  <h2 id="before-the-first-day">Before the first day</h2>
  <p>The people team sends a welcome email two weeks before the start date. Complete the steps below before arriving.</p>
  <h3 id="paperwork">Paperwork</h3>
  <p>Sign the employment contract and submit tax and bank details through the HR portal. Payroll needs these details five business days before the first pay run.</p>
  <h3 id="equipment-and-accounts">Equipment and accounts</h3>
  <p>IT prepares a laptop, a security badge, and accounts for email, chat, and the warehouse management system.</p>
  <h4 id="laptop-setup">Laptop setup</h4>
  <p>The laptop arrives with the standard software installed. Sign in with the temporary password from the welcome email and set up multi-factor authentication.</p>
  <h4 id="building-access">Building access</h4>
  <p>Collect the security badge from reception at 8:30 a.m. on the first day. Badges open the main office and the depot staff entrance.</p>
  <h2 id="the-first-week">The first week</h2>
  <p>The first week focuses on safety training and getting to know the team.</p>
  <h3 id="orientation-sessions">Orientation sessions</h3>
  <ul>
    <li>Monday: company overview and workplace health and safety</li>
    <li>Tuesday: systems training</li>
    <li>Wednesday: depot tour and introduction to the dispatch team</li>
  </ul>
  <h3 id="meeting-the-team">Meeting the team</h3>
  <p>Each new starter is paired with a buddy from the same team for the first month. The buddy is the first point of contact for day-to-day questions.</p>
  <h2 id="the-first-90-days">The first 90 days</h2>
  <p>The probation period lasts 90 days and includes two formal reviews.</p>
  <h3 id="goals-and-check-ins">Goals and check-ins</h3>
  <p>Managers agree on three goals with each new starter in the first week and hold a short check-in every Friday.</p>
  <h4 id="review-30-day">30-day review</h4>
  <p>A conversation about progress on the three goals and any support needed.</p>
  <h4 id="review-90-day">90-day review</h4>
  <p>Confirms the end of probation and sets goals for the next six months.</p>
  <h3 id="training">Training</h3>
  <p>Complete the four required online courses within the first 30 days: data privacy, fire safety, manual handling, and code of conduct.</p>
  <h2 id="policies-and-support">Policies and support</h2>
  <h3 id="leave-and-time-off">Leave and time off</h3>
  <p>Full-time staff receive 20 days of annual leave per year, accrued from the start date. Request leave through the HR portal at least two weeks in advance.</p>

  <h1>Ingredient sheet: Daily Barrier Moisturizer</h1>
  <p>Fragrance-free daily face cream, 1.7 fl oz (50 mL). For normal to dry skin. Revised November 18 by the product safety team.</p>
  <h2>Key ingredients</h2>
  <ul>
    <li><span style="color: #335dff;"><strong>Niacinamide (4%)</strong></span> evens skin tone and supports the skin barrier.</li>
    <li><span style="color: #335dff;"><strong>Sodium hyaluronate</strong></span> draws water into the outer layer of the skin.</li>
    <li><strong>Ceramide NP</strong> replaces lipids lost through cleansing and cold weather.</li>
  </ul>
  <h2>Full ingredient list</h2>
  <p>Aqua (Water), Glycerin, Niacinamide, Caprylic/Capric Triglyceride, Cetearyl Alcohol, Squalane, Ceramide NP, Sodium Hyaluronate, Panthenol, Tocopherol, Parfum (Natural Essential Oil Blend), <span style="background-color: #fff3b0;">Linalool</span>, <span style="background-color: #fff3b0;">Limonene</span>, Citronellol, Phenoxyethanol, Ethylhexylglycerin.</p>
  <p><span style="color: #17224f;">Ingredients highlighted in yellow are fragrance allergens that must be listed on the label when they exceed 0.001% in leave-on products.</span></p>
  <h2>Free from</h2>
  <p><span style="background-color: #f0f3ff;">Parabens</span>, <span style="background-color: #f0f3ff;">mineral oil</span>, <span style="background-color: #f0f3ff;">synthetic dyes</span>, and <span style="background-color: #f0f3ff;">microplastics</span>.</p>

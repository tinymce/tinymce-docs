  <h1>Contributing to Lumen</h1>
  <p>Lumen is an open-source image optimizer maintained by volunteers. "Every fix counts -- even a typo in the docs," says maintainer Priya Shah. This guide explains how to propose a change , from the first issue to the final review.</p>
  <h2>Before you start</h2>
  <ul>
    <li>Search the open issues first. If someone's already working on it, offer to help instead of starting over.</li>
    <li>For changes that affect more than 1/2 of the codebase, open a discussion before writing code.</li>
    <li>Test on a 1920x1080 screen and at 3/4 zoom ; the preview panel is the most common source of layout bugs.</li>
  </ul>
  <h2>Submitting a pull request</h2>
  <p>The workflow is fork -&gt; branch -&gt; commit -&gt; pull request. Keep each pull request small:a reviewer should be able to read it in 15 minutes. Write the commit summary in the imperative mood,for example "Add WebP support" rather than "Added WebP support".</p>
  <p>Run the test suite before you push:</p>
  <pre class="language-bash"><code>npm test -- --coverage
git commit -m "Fix crash when --quality is 0"</code></pre>
  <p>Pull requests that change the compression settings must keep quality &lt;= 95 and file size within +-2% of the current release. CI checks both...and blocks the merge if either fails.</p>
  <h2>Translations</h2>
  <p>The interface is translated by the community. Two translators describe what they look for:</p>
  <ul>
    <li><span lang="de">"Kurze, klare S&auml;tze sind am besten", sagt Jonas Becker.</span></li>
    <li><span lang="es">"Siempre revisamos el texto con un colega", dice Luc&iacute;a Torres.</span></li>
  </ul>

  <h1>Back on track: the summit railway reopens</h1>
  <p>After 14 months of work , the 1920s rack railway to the summit is running again. "It's the steepest line of its kind in the region," says chief engineer Ana Ruiz. "We've rebuilt 3/4 of the track -- and the last 1/2 kilometer opens in spring."</p>
  <p>The route climbs from the lake station -&gt; the middle station -&gt; the summit, with trains every 30 minutes. Each restored carriage seats 40 passengers,measures 12x3 meters and has heated benches. Groups of &lt;= 12 people can travel without booking.</p>
  <p>Pack a warm coat: in January the temperature at the summit station can drop to -15 C,, even on clear days. On a good morning the whole valley is visible... and on a bad one, nothing at all.</p>

  <p lang="es">"Es un viaje que nadie olvida", dice la gu&iacute;a Luc&iacute;a Torres.</p>

  <p>Island coves is a six-week series made along the southeast coast of Mallorca. Most frames were shot in the first hour after sunrise, before the boats went out and while the water was still flat.</p>
  <h2>Mountains and lakes</h2>
  <h3>Morning row</h3>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/boat-daylight-lake-675764_thumb.jpg" alt="The wooden bow of a rowing boat on a still alpine lake, with jagged peaks lit by the low sun behind" width="220" height="147">The bow of a rental boat frames the peaks across the lake. The sun was just clearing the ridge, so the shot needs a little warmth and a slight lift in the shadows before it goes to print.</p>
  <h3>Pass road in June</h3>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/adventure-altitude-cold-1145378_thumb.jpg" alt="An empty road curving up a green mountain valley toward snow-streaked peaks under a gray sky" width="220" height="165">A two-lane road winds up toward snow that had not yet melted. This frame is printed in black and white for the gallery wall, so it is a good one to try a filter on.</p>
  <h2>Forests</h2>
  <h3>Boardwalk climb</h3>
  <p><img style="float: right;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/tiny-drive-demo/images/Hero%20Backgrounds/forest-landscape-nature-6921_thumb.jpg" alt="A wooden boardwalk with steps leading up a steep path through a tall pine forest" width="220" height="165">Shot vertically on the trail, then cropped to landscape for the website. The original file is untouched, so every edit here can be reverted.</p>

  <h1>Module 4: Building and putting out a campfire</h1>
  <p><strong>Course:</strong> Outdoor Leadership Certificate<br><strong>Time to complete:</strong> 35 minutes<br><strong>Assignment due:</strong> December 13</p>
  <h2>Learning objectives</h2>
  <p>By the end of this module, learners can:</p>
  <ol>
    <li>Choose a safe site for a campfire and check local fire restrictions.</li>
    <li>Build a teepee fire lay from tinder, kindling and fuel wood.</li>
    <li>Put a fire out completely and confirm that it is cold.</li>
  </ol>
  <h2>Video lesson: the teepee fire lay</h2>
  <p>Watch the demonstration before reading the steps below. It shows a teepee fire lay burning at full flame, with the kindling leaning in toward the center.</p>
  <uc-video uuid="83fd9f98-1939-4d99-b5e3-85563f89f5fb" class="tox-uc-video"></uc-video>
  <h2>Building the fire, step by step</h2>
  <ol>
    <li>Clear a circle about 10 feet across down to bare soil, or use an existing fire ring.</li>
    <li>Place a loose ball of tinder, such as dry grass or birch bark, in the center.</li>
    <li>Lean pencil-thin kindling over the tinder to form a cone, leaving a gap on the upwind side.</li>
    <li>Light the tinder through the gap, then add thicker sticks as the kindling catches.</li>
  </ol>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 17.0%;"><col style="width: 37.5%;"><col style="width: 45.5%;"></colgroup>

      <tr><td>Teepee</td><td>Fast heat and boiling water</td><td>Hot and short, needs frequent fuel</td></tr>
      <tr><td>Log cabin</td><td>Cooking over coals</td><td>Steady, forms an even bed of coals</td></tr>
      <tr><td>Lean-to</td><td>Windy sites</td><td>Sheltered, slower to start</td></tr>
    </tbody>
  </table>
  <h2>Putting the fire out</h2>
  <ul>
    <li>Drown the fire with water, starting at the edges and working inward.</li>
    <li>Stir the ashes with a stick and add more water until there is no hiss or steam.</li>
    <li>Hold the back of a hand just above the ashes. If any heat can be felt, repeat.</li>
  </ul>

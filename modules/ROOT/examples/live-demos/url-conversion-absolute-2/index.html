  <p>The customer help center moves to the new platform on Tuesday, December 15. Work through this checklist in order. Mark each item done in the <a href="../migration-tracker/">migration tracker</a> as you finish it.</p>

  <ul>
    <li>Freeze new articles, except urgent fixes.</li>
    <li>Export all articles, images, and attachments.</li>
    <li>Map old article addresses to new ones in the <a href="redirect-map/">redirect map</a>.</li>
  </ul>
  <h2>Migration day</h2>
  <ol>
    <li>Post the maintenance notice at 6:00 AM.</li>
    <li>Import the export files into the new platform.</li>
    <li>Turn on redirects and test the 20 most visited articles.</li>
    <li>Remove the maintenance notice by 9:00 AM.</li>

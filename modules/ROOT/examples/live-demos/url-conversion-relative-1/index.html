  <h1>Support team wiki: your first week</h1>
  <p>Welcome to the customer support team. This page lists what to set up before your first shift on Monday, December 7, and who to ask when something does not work.</p>
  <h2>Day one: laptop and accounts</h2>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop on a wooden table, next to two phones and a cup of coffee" width="240" height="138">IT hands out laptops at 9:00 AM in room 4B. Sign in with the temporary password from your welcome email, then set up two-factor authentication on your phone before 5:00 PM. If the laptop is not ready, log a request on the <a href="../it-requests/">IT requests</a> page.</p>
  <ul>
    <li>Join the support shifts channel in team chat.</li>
    <li>Ask your team lead to add you to the ticket queue.</li>
    <li>Read the <a href="../escalation-policy/">escalation policy</a> before your first shift.</li>
  </ul>
  <h2>Your onboarding buddy</h2>
  <p><img style="float: left;" src="https://www.tiny.cloud/docs/tinymce/latest/_images/unsplash/uifaces-unsplash-portrait-Natali_Craig.jpg" alt="Portrait of a woman with long brown hair and a striped shirt, outdoors at sunset" width="120" height="120">Dana Whitfield, Senior Support Specialist, is your buddy for the first two weeks. Dana sits in on your first ten tickets, reviews your replies before they are sent, and answers questions about tone and wording. Reach Dana at (555) 010-0199 or in team chat.</p>

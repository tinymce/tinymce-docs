  <h1>Data retention schedule</h1>
  <p>Owner: Records Management. Effective January 1, 2027. This schedule sets how long each type of company record is kept, and what happens to it at the end of that period.</p>
  <h2>How to use this schedule</h2>
  <p>Find the record type in the table, keep the record for the period shown, then follow the disposal method. When a record is part of a legal hold, keep it until Legal releases the hold, even if the retention period has ended.</p>
  <h2>Retention periods</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 28.8%;"><col style="width: 44.2%;"><col style="width: 27.0%;"></colgroup>
    <thead>
      <tr><th>Record type</th><th>Retention period</th><th>Disposal method</th></tr>
    </thead>
    <tbody>
      <tr><td>Invoices and receipts</td><td>7 years after the end of the fiscal year</td><td>Secure deletion</td></tr>
      <tr><td>Employee files</td><td>6 years after employment ends</td><td>Secure deletion</td></tr>
      <tr><td>Customer support tickets</td><td>3 years after the ticket is closed</td><td>Anonymize, then delete</td></tr>
      <tr><td>Security camera footage</td><td>30 days</td><td>Automatic overwrite</td></tr>
    </tbody>
  </table>
  <h2>Email and devices</h2>
  <p><img style="float: right;" src="//www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop on a wooden table, next to two phones and a cup of coffee" width="240" height="138">Email is kept for 2 years, then deleted automatically. Laptops and phones are wiped before they are reused or recycled. IT keeps a wipe certificate for each device for 3 years.</p>
  <h2>Questions</h2>
  <p>Contact Records Management at (555) 010-0199. For the state rules this schedule is based on, see the <a href="https://www.example.com/">state records retention guidance</a>.</p>
</textarea>

<textarea id="user-formatting">
  <blockquote><p><strong>Try it:</strong> select text and apply a heading from <strong>Blocks</strong>, a named style from <strong>Styles</strong>, a typeface from <strong>Fonts</strong>, or a brand color from <strong>Text color</strong>. Type a size into the font size box, or use the buttons on either side of it. Change the spacing with <strong>Line height</strong>, and nest list items with <strong>Increase indent</strong> up to three levels deep.</p></blockquote>
  <h1>Northwind Analytics writing guide</h1>
  <p class="lead">This guide describes how product announcements, help articles, and release notes look and sound, so every page reads as one voice.</p>
  <h2><span style="color: #174ea6;">Typography</span></h2>
  <p>Body text uses Inter at 16px with a line height of 1.6. Use <span style="font-family: georgia, serif;">Georgia</span> only for pull quotes, and <span style="font-family: 'courier new', courier, monospace;">Courier New</span> only for code and file names.</p>
  <p style="line-height: 2;">Long legal notices use a line height of 2, so they stay readable at small sizes.</p>
  <h2><span style="color: #174ea6;">Color</span></h2>
  <p>Headings use <span style="color: #174ea6;">Northwind Blue</span>. Use <span style="background-color: #fff3b0;">Highlight Yellow</span> only to draw attention to a change, and <span style="color: #c62828;">Alert Red</span> only for warnings.</p>
  <h2><span style="color: #174ea6;">Structure</span></h2>
  <p>Start every article with a lead paragraph, then move from the most common task to the least common.</p>
  <p style="padding-left: 24px;">Indent supporting detail by one step, so readers can skip it.</p>
  <ul>
    <li>Release notes
      <ul>
        <li>New features
          <ul>
            <li>One bullet for each feature</li>
          </ul>
        </li>
        <li>Fixes</li>
      </ul>
    </li>
    <li>Help articles</li>
  </ul>
  <p><small>Last reviewed by the content design team in March.</small></p>
</textarea>

  <h1>Set up two-factor authentication</h1>
  <p>Applies to all staff accounts. Last updated December 2.</p>
  <p><img style="float: right;" src="https://www.tiny.cloud/images/image-two.jpg" alt="Hands typing on a laptop on a wooden table, next to two phones and a cup of coffee" width="240" height="138">Two-factor authentication asks for a code from a phone each time someone signs in from a new device. From <strong>Monday, December 14</strong>, every staff account must have it turned on. Accounts without it are locked until the help desk resets them.</p>
  <h2>Before you start</h2>
  <ul>
    <li>A phone with the company authenticator app installed</li>
    <li>A laptop signed in to the staff portal</li>
  </ul>
  <h2>Turn on two-factor authentication</h2>
  <ol>
    <li>In the staff portal, select <strong>Profile</strong>, then <strong>Security</strong>.</li>
    <li>Select <strong>Set up two-factor authentication</strong>. A QR code appears.</li>
    <li>Open the authenticator app, tap <em>Add account</em>, and scan the code.</li>
    <li>Enter the six-digit code from the app and select <strong>Verify</strong>.</li>
  </ol>
  <p><em>Save the ten backup codes</em> that appear after setup. Each code works once, if the phone is lost or out of battery.</p>
  <h2>Troubleshooting</h2>
  <table style="border-collapse: collapse; width: 100%;" border="1">
    <colgroup><col style="width: 35.1%;"><col style="width: 64.9%;"></colgroup>
    <thead>
      <tr><th>Problem</th><th>Solution</th></tr>
    </thead>
    <tbody>
      <tr><td>The code is rejected</td><td>Check that the phone's clock is set automatically, then try the next code.</td></tr>
      <tr><td>New phone</td><td>Sign in with a backup code, then repeat the setup steps on the new phone.</td></tr>
      <tr><td>No backup codes left</td><td>Call the help desk to verify identity and reset two-factor authentication.</td></tr>
    </tbody>
  </table>
  <p>Still stuck? Call the help desk at (555) 010-0199, 8:00 AM to 6:00 PM, Monday to Friday, or <a href="https://www.example.com/">open a ticket</a>.</p>
</textarea>
